# TEMPORARY scratch checks for the fresh-run-works PR. Deleted before merge.
name: Scratch fresh-run checks

on:
  push:
    branches: [pgp/fresh-run-works]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image facts and Cyrius resolution
        run: bash .github/scratch/facts.sh

  align:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Read groups, sample name, unaligned BAM, Mutect2 chrM
        run: bash .github/scratch/align.sh

  annot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Steps 30, 23, 31, 12
        run: bash .github/scratch/annot.sh

  manta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Manta and Strelka2 twice
        run: bash .github/scratch/manta.sh

  setup-annotsv:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Download speed of the AnnotSV annotation server
        run: |
          curl -sL -r 0-104857599 -o /dev/null -w 'first 100 MB: %{time_total} s, %{speed_download} bytes/s\n' \
            https://www.lbgi.fr/~geoffroy/Annotations/Annotations_Human_3.5.tar.gz
      - name: setup.sh and validate-setup.sh under a fake docker, AnnotSV for real
        run: bash .github/scratch/setup-annotsv.sh

  cyrius:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the HG002 slice
        uses: actions/cache@v4
        with:
          path: /mnt/scratch/cyslice
          key: scratch-hg002-cyrius-regions-v1
      - name: Step 21 on a public HG002 slice
        run: bash .github/scratch/cyrius.sh
