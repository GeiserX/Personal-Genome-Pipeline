name: Lint

# No path filter: a docs-only change still gets the link check, and a
# required check never waits on a run that was not started.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck on all scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts
          severity: warning
          version: v0.11.0

  actionlint:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tarball must match its line in the release's checksums file;
      # a missing line fails too.
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          awk -v f="$tarball" '$2 == f' checksums.txt | sha256sum -c -
          tar xzf "$tarball" -C /usr/local/bin actionlint

      - name: Run actionlint
        run: actionlint -color

  gitleaks:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          awk -v f="$tarball" '$2 == f' checksums.txt | sha256sum -c -
          tar xzf "$tarball" -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks git --verbose .

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for broken internal links
        run: |
          echo "Checking internal markdown links..."
          rm -f /tmp/link_fail
          for md in docs/*.md README.md; do
            # Extract markdown links: [text](target)
            grep -oP '\]\([^)]+\)' "$md" 2>/dev/null | \
              grep -oP '\(([^)]+)\)' | tr -d '()' | \
              grep -v '^http' | grep -v '^#' | \
              while read -r link; do
                file=$(echo "$link" | cut -d'#' -f1)
                if [ -n "$file" ]; then
                  dir=$(dirname "$md")
                  target="${dir}/${file}"
                  if [ ! -f "$target" ]; then
                    echo "BROKEN: ${md} -> ${link} (file not found: ${target})"
                    echo "1" > /tmp/link_fail
                  fi
                fi
              done
          done
          if [ -f /tmp/link_fail ]; then
            exit 1
          fi
          echo "OK: All internal links valid"
