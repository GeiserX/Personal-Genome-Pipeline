name: Nextflow

# Runs on every pull request with no workflow-level path filter, so a
# required check never waits on a run that was not started. A pull request
# that only touches docs passes after the first step instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 2 * *'   # monthly: a new 26.04.x release is tested even when nothing here changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two Nextflow lines. "pinned" is NEXTFLOW_VERSION from versions.env, the
  # release the pipeline is validated with, and blocks. "26.04" is the newest
  # 26.04.x release, which the manifest refuses until this leg is green: the
  # leg lifts that cap in its own checkout, reports its own result and does
  # not block.
  nextflow:
    name: nextflow (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.line != 'pinned' }}
    strategy:
      fail-fast: false
      matrix:
        line: [pinned, '26.04']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip when the pull request only changes docs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            changed=$(git diff --name-only "$BASE" HEAD)
            printf 'changed files:\n%s\n' "$changed"
            if [ -n "$changed" ]; then
              run=false
              while IFS= read -r f; do
                case "$f" in
                  docs/*|*.md|mkdocs.yml|LICENSE) ;;
                  *) run=true ;;
                esac
              done <<<"$changed"
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "Only docs changed: nothing here can affect the pipeline, skipping the Nextflow steps."

      - name: Resolve the Nextflow version
        if: steps.scope.outputs.run == 'true'
        id: nf
        env:
          LINE: ${{ matrix.line }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LINE" = pinned ]; then
            # shellcheck source=/dev/null
            . ./versions.env
            v=${NEXTFLOW_VERSION:?NEXTFLOW_VERSION is not set in versions.env}
          else
            v=$(gh api "repos/nextflow-io/nextflow/releases?per_page=100" --jq '.[].tag_name' \
                | awk -v p="v${LINE}." 'index($0, p) == 1 && substr($0, length(p) + 1) ~ /^[0-9]+$/ { print substr($0, 2) }' \
                | sort -V | tail -1)
            [ -n "$v" ] || { echo "ERROR: found no ${LINE}.x release of Nextflow"; exit 1; }
          fi
          echo "Nextflow ${v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          version: ${{ steps.nf.outputs.version }}

      - name: The manifest refuses this release; lift the cap in this checkout
        if: steps.scope.outputs.run == 'true' && matrix.line != 'pinned'
        run: |
          rc=0
          nextflow run main.nf -profile test_all -stub -ansi-log false --outdir "${RUNNER_TEMP}/refused" \
            > "${RUNNER_TEMP}/refused.log" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/refused.log"
          if [ "$rc" -eq 0 ] || ! grep -q 'does not match' "${RUNNER_TEMP}/refused.log"; then
            echo "FAIL: the manifest did not refuse this release; if 26.x is supported now, remove this step"
            exit 1
          fi
          # Only the cap goes; the floor is whatever the manifest says.
          sed -i -E "s/^( *nextflowVersion *= *'![^',]*), *<26'/\1'/" nextflow.config
          grep -qE "^ *nextflowVersion *= *'![^',]*'\$" nextflow.config || { echo "FAIL: could not lift the cap"; exit 1; }
          echo "Cap lifted for this run: $(grep nextflowVersion nextflow.config)"

      - name: Validate Nextflow config
        if: steps.scope.outputs.run == 'true'
        run: nextflow config main.nf -profile docker > /dev/null

      # Parses every .nf and .config file with the strict syntax and fails on
      # an error, which `nextflow run main.nf -help` never did. KNOWN lists
      # the errors already on main in files this workflow does not own, by
      # file and message, until their own fix lands; any other error fails.
      - name: Lint the pipeline
        if: steps.scope.outputs.run == 'true'
        env:
          KNOWN: |
            modules/local/vcf_precheck/main.nf: FILTER_STATUS is not defined
            modules/local/vcf_precheck/main.nf: FILTER_COUNTS is not defined
        run: |
          export LC_ALL=C
          rc=0
          nextflow lint . > "${RUNNER_TEMP}/lint.log" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/lint.log"
          # "Error <file>:<line>:<col>: <message>" becomes "<file>: <message>".
          errors=$(sed -e 's/\x1b\[[0-9;]*m//g' "${RUNNER_TEMP}/lint.log" | tr -d '`' \
            | sed -n 's/^Error  *\([^:]*\):[0-9]*:[0-9]*: \(.*\)$/\1: \2/p' | sort -u)
          known=$(printf '%s\n' "$KNOWN" | sed '/^$/d' | sort -u)
          new=$(comm -23 <(printf '%s\n' "$errors" | sed '/^$/d') <(printf '%s\n' "$known"))
          gone=$(comm -13 <(printf '%s\n' "$errors" | sed '/^$/d') <(printf '%s\n' "$known"))
          if [ -n "$gone" ]; then
            while IFS= read -r e; do echo "::warning::fixed, remove it from KNOWN: ${e}"; done <<<"$gone"
          fi
          if [ -n "$new" ]; then
            echo "FAIL: nextflow lint found errors:"; printf '%s\n' "$new"; exit 1
          fi
          if [ "$rc" -ne 0 ] && [ -z "$errors" ]; then
            echo "FAIL: nextflow lint exited ${rc} with no error line this step can read"; exit 1
          fi
          echo "OK: no lint error beyond the $(printf '%s\n' "$known" | grep -c .) known ones"

      - name: Validate nextflow_schema.json and the samplesheet schema
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 -m json.tool nextflow_schema.json > /dev/null
          python3 -m json.tool assets/schema_input.json > /dev/null

      # The default tools, each stub run inside its own image.
      - name: Stub run of the test profile with Docker
        if: steps.scope.outputs.run == 'true' && matrix.line == 'pinned'
        run: |
          # Many bioinformatics images run as non-root, which cannot write the
          # Nextflow work directory on a GitHub-hosted runner.
          cat > "${RUNNER_TEMP}/ci.config" <<'CICONF'
          timeline.enabled = false
          report.enabled = false
          docker.runOptions = '-u 0:0'
          process.resourceLimits = [ cpus: 2, memory: '6.GB', time: '1.h' ]
          CICONF
          nextflow run main.nf -profile test,docker -stub -ansi-log false -c "${RUNNER_TEMP}/ci.config" \
            --outdir "${RUNNER_TEMP}/test-out"

      # Every tool with no container engine: the stubs only touch files. Each
      # process writes the tag of the image Nextflow gave it (task.container)
      # into its versions.yml.
      - name: Stub run of every tool (test_all profile)
        if: steps.scope.outputs.run == 'true'
        run: |
          nextflow run main.nf -profile test_all -stub -ansi-log false --outdir "${RUNNER_TEMP}/all-tools"

      # gen-containers-config.sh --check (Guard) proves every process in
      # modules/ has a selector; this proves every one of them ran and got
      # the image versions.env gives it.
      - name: Every process ran and states the tag of its image from versions.env
        if: steps.scope.outputs.run == 'true'
        run: |
          cat "${RUNNER_TEMP}/all-tools/pipeline_info/software_versions.yml"
          scripts/ci/gen-containers-config.sh --check-versions "${RUNNER_TEMP}/all-tools/pipeline_info/software_versions.yml"
