name: Nextflow

# Runs on every pull request with no workflow-level path filter, so a
# required check never waits on a run that was not started. A pull request
# that only touches docs passes after the first step instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 2 * *'   # monthly: a new 26.10.x release is tested even when nothing here changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two Nextflow lines, both accepted by the manifest's nextflowVersion:
  # "pinned" is NEXTFLOW_VERSION from versions.env, the release the pipeline
  # is validated with; "26.10" is the newest 26.10.x release, so a new patch
  # release that breaks the pipeline turns the monthly run red.
  nextflow:
    name: nextflow (${{ matrix.line }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        line: [pinned, '26.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip when the pull request only changes docs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            # --no-renames: a file moved into docs/ also lists the path it left.
            changed=$(git diff --no-renames --name-only "$BASE" HEAD)
            printf 'changed files:\n%s\n' "$changed"
            if [ -n "$changed" ]; then
              run=false
              while IFS= read -r f; do
                case "$f" in
                  docs/*|*.md|mkdocs.yml|LICENSE) ;;
                  *) run=true ;;
                esac
              done <<<"$changed"
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "Only docs changed: nothing here can affect the pipeline, skipping the Nextflow steps."

      - name: Resolve the Nextflow version
        if: steps.scope.outputs.run == 'true'
        id: nf
        env:
          LINE: ${{ matrix.line }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LINE" = pinned ]; then
            # shellcheck source=/dev/null
            . ./versions.env
            v=${NEXTFLOW_VERSION:?NEXTFLOW_VERSION is not set in versions.env}
          else
            v=$(gh api "repos/nextflow-io/nextflow/releases?per_page=100" --jq '.[].tag_name' \
                | awk -v p="v${LINE}." 'index($0, p) == 1 && substr($0, length(p) + 1) ~ /^[0-9]+$/ { print substr($0, 2) }' \
                | sort -V | tail -1)
            [ -n "$v" ] || { echo "ERROR: found no ${LINE}.x release of Nextflow"; exit 1; }
          fi
          echo "Nextflow ${v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'

      # Not a Nextflow pin: the version comes from versions.env or the newest
      # 26.10.x. Quoted so the Renovate dry run does not count it as one.
      - uses: "nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914" # v3.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          version: ${{ steps.nf.outputs.version }}

      - name: Validate Nextflow config
        if: steps.scope.outputs.run == 'true'
        run: nextflow config main.nf -profile docker > /dev/null

      # Parses every .nf and .config file with the strict syntax and fails on
      # an error, which `nextflow run main.nf -help` never did.
      - name: Lint the pipeline
        if: steps.scope.outputs.run == 'true'
        run: |
          rc=0
          nextflow lint . > "${RUNNER_TEMP}/lint.log" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/lint.log"
          errors=$(sed -e 's/\x1b\[[0-9;]*m//g' "${RUNNER_TEMP}/lint.log" | grep -c '^Error ' || true)
          if [ "$errors" -gt 0 ] || [ "$rc" -ne 0 ]; then
            echo "FAIL: nextflow lint exited ${rc} with ${errors} error line(s)"; exit 1
          fi
          echo "OK: nextflow lint found no error"

      - name: Validate nextflow_schema.json and the samplesheet schema
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 -m json.tool nextflow_schema.json > /dev/null
          python3 -m json.tool assets/schema_input.json > /dev/null

      # The default tools, each stub run inside its own image.
      - name: Stub run of the test profile with Docker
        if: steps.scope.outputs.run == 'true' && matrix.line == 'pinned'
        timeout-minutes: 20
        run: |
          # Many bioinformatics images run as non-root, which cannot write the
          # Nextflow work directory on a GitHub-hosted runner.
          cat > "${RUNNER_TEMP}/ci.config" <<'CICONF'
          timeline.enabled = false
          report.enabled = false
          docker.runOptions = '-u 0:0'
          process.resourceLimits = [ cpus: 2, memory: '6.GB', time: '1.h' ]
          CICONF
          nextflow run main.nf -profile test,docker -stub -ansi-log false -c "${RUNNER_TEMP}/ci.config" \
            --outdir "${RUNNER_TEMP}/test-out"

      # The docker profile runs every container with --network none, with no
      # exception: Cyrius is opt-in and runs from the install setup.sh
      # --cyrius made. A default run has no CYRIUS task at all. Each task's
      # .command.run holds its docker run line.
      - name: Every container ran without network, and a default run has no CYRIUS task
        if: steps.scope.outputs.run == 'true' && matrix.line == 'pinned'
        run: |
          total=0 cyrius=0 bad=0
          while IFS= read -r run; do
            name=$(sed -n "s/^### name: [\"']\(.*\)[\"']\$/\1/p" "$run")
            line=$(grep -m1 'docker run' "$run" || true)
            [ -n "$line" ] || { echo "FAIL ${name:-$run}: no docker run line"; bad=$((bad + 1)); continue; }
            total=$((total + 1))
            case "$name" in *CYRIUS*) cyrius=$((cyrius + 1)) ;; esac
            if ! grep -q -- '--network none' <<<"$line"; then
              echo "FAIL ${name}: no --network none"; bad=$((bad + 1))
            fi
          done < <(find work -name .command.run)
          echo "tasks: ${total}, CYRIUS tasks: ${cyrius}, with network: ${bad}"
          [ "$total" -gt 1 ] && [ "$cyrius" -eq 0 ] && [ "$bad" -eq 0 ]

      # Every tool with no container engine: the stubs only touch files. Each
      # process writes the tag of the image Nextflow gave it (task.container)
      # into its versions.yml. --pedigree adds the family workflow over the
      # FASTQ and BAM-only rows (the two DEEPVARIANT gives a gVCF). It is given
      # here and not in conf/test_all.config, because other runs of the profile
      # bring their own samplesheet, which the stub pedigree does not name.
      # --hpo turns on exomiser (step 48) for the one sample it names, for the
      # same reason here too.
      - name: Stub run of every tool (test_all profile)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          nextflow run main.nf -profile test_all -stub -ansi-log false --outdir "${RUNNER_TEMP}/all-tools" \
            -work-dir "${RUNNER_TEMP}/all-tools-work" --pedigree assets/stub/pedigree.tsv \
            --hpo HP:0001250 --exomiser_proband stub_sample --exomiser_data assets/stub/db

      # The stub samplesheet has four samples with alignments (one aligned
      # from FASTQ, one given as CRAM): the T1K index is built once for all of
      # them, each is typed, and each went through INDEXCOV.
      - name: T1K_BUILD ran once, HLA_TYPING once per sample with a BAM
        if: steps.scope.outputs.run == 'true'
        run: |
          count() { find "${RUNNER_TEMP}/all-tools-work" -name .command.run -exec sed -n "s/^### name: [\"']\(.*\)[\"']\$/\1/p" {} + \
            | grep -cE "(^|:)$1( |\$)" || true; }
          build=$(count T1K_BUILD) typing=$(count HLA_TYPING) indexcov=$(count INDEXCOV) dv=$(count DEEPVARIANT)
          bams=$(awk -F, 'NR == 1 {for (i = 1; i <= NF; i++) c[$i] = i; next} $c["bam"] != "" || $c["fastq_1"] != "" || $c["cram"] != ""' assets/test_samplesheet.csv | wc -l)
          echo "samples with a BAM: ${bams}; T1K_BUILD tasks: ${build}; HLA_TYPING tasks: ${typing}; INDEXCOV tasks: ${indexcov}; DEEPVARIANT tasks: ${dv}"
          [ "$bams" -ge 2 ] && [ "$build" -eq 1 ] && [ "$typing" -eq "$bams" ] && [ "$indexcov" -eq "$bams" ] && [ "$dv" -eq 2 ]

      # A FASTQ row is aligned by one task that pipes minimap2 into samtools
      # fixmate, sort and markdup, as step 02 does: no task writes the SAM to
      # disk (it was a <sample>.sam.gz in the work directory, 119 GB in one
      # observed 30x run). The stub sheet has a FASTQ row, so ALIGN_MINIMAP2
      # must have run: that count is the control for the empty find.
      - name: The FASTQ row is aligned in one task, with no SAM file in the work directory
        if: steps.scope.outputs.run == 'true'
        run: |
          work="${RUNNER_TEMP}/all-tools-work"
          count() { find "$work" -name .command.run -exec sed -n "s/^### name: [\"']\(.*\)[\"']\$/\1/p" {} + \
            | grep -cE "(^|:)$1( |\$)" || true; }
          align=$(count ALIGN_MINIMAP2) markdup=$(count ALIGN_MARKDUP)
          sams=$(find "$work" -type f \( -name '*.sam' -o -name '*.sam.gz' \) | wc -l)
          find "$work" -type f \( -name '*.sam' -o -name '*.sam.gz' \) | awk 'NR <= 5'
          echo "ALIGN_MINIMAP2 tasks: ${align}; ALIGN_MARKDUP tasks: ${markdup}; SAM files in the work directory: ${sams}"
          [ "$align" -ge 1 ] && [ "$markdup" -eq 0 ] && [ "$sams" -eq 0 ]

      # The common path of an existing user: VCF+BAM rows only, and a
      # reference with no .sr.mmi beside it. The FASTQ channel is empty, so
      # MINIMAP2_INDEX and the alignment must not run, and the run must still
      # end (no hang on the empty channel). The all-tools run above, whose
      # sheet has a FASTQ row, is the control: there the same count finds them.
      - name: A VCF+BAM sheet with no index beside the reference aligns nothing
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          [ ! -e assets/stub/reference.sr.mmi ] || { echo "FAIL: assets/stub/reference.sr.mmi exists, the case is not tested"; exit 1; }
          sheet="${RUNNER_TEMP}/vcf_bam_only.csv"
          awk -F, 'NR == 1 {for (i = 1; i <= NF; i++) c[$i] = i; print; next}
            $c["vcf"] != "" && $c["bam"] != "" && $c["fastq_1"] == ""' assets/test_samplesheet.csv > "$sheet"
          cat "$sheet"
          [ "$(awk 'NR > 1' "$sheet" | wc -l)" -eq 1 ] || { echo "FAIL: want one VCF+BAM row in the stub samplesheet"; exit 1; }
          nextflow run main.nf -profile test -stub -ansi-log false --input "$sheet" \
            --outdir "${RUNNER_TEMP}/vcf-bam-out" -work-dir "${RUNNER_TEMP}/vcf-bam-work"
          count() { find "$1" -name .command.run -exec sed -n "s/^### name: [\"']\(.*\)[\"']\$/\1/p" {} + \
            | grep -cE "(^|:)$2( |\$)" || true; }
          bad=0
          for p in MINIMAP2_INDEX ALIGN_MINIMAP2; do
            here=$(count "${RUNNER_TEMP}/vcf-bam-work" "$p") control=$(count "${RUNNER_TEMP}/all-tools-work" "$p")
            echo "${p}: ${here} tasks here, ${control} in the all-tools run"
            [ "$here" -eq 0 ] && [ "$control" -ge 1 ] || bad=1
          done
          for p in FASTP DEEPVARIANT; do
            here=$(count "${RUNNER_TEMP}/vcf-bam-work" "$p"); echo "${p}: ${here} tasks here"; [ "$here" -eq 0 ] || bad=1
          done
          indexcov=$(count "${RUNNER_TEMP}/vcf-bam-work" INDEXCOV); echo "INDEXCOV: ${indexcov} tasks here"
          [ "$indexcov" -eq 1 ] || bad=1
          [ "$bad" -eq 0 ]

      # gen-containers-config.sh --check (Guard) proves every process in
      # modules/ has a selector; this proves every one of them ran and got
      # the image versions.env gives it.
      - name: Every process ran and states the tag of its image from versions.env
        if: steps.scope.outputs.run == 'true'
        run: |
          cat "${RUNNER_TEMP}/all-tools/pipeline_info/software_versions.yml"
          scripts/ci/gen-containers-config.sh --check-versions "${RUNNER_TEMP}/all-tools/pipeline_info/software_versions.yml"

      # What the heavy tasks ask for, read back from the trace of a stub run,
      # so it is the value Nextflow resolved and not the config text. The caps
      # sit above every request, so resourceLimits hides nothing. Each checked
      # task exits 137 on its first attempt, as an out-of-memory kill would,
      # and the second attempt must ask for twice the memory: a fixed memory
      # value would stop the retry from doubling it. Expected: DEEPVARIANT gets
      # --max_time on its first attempt (Nextflow before 26.10.0 can abort the
      # whole run when a task passes its time limit, nextflow-io/nextflow#7569;
      # read in its source, not reproduced), FASTP gets the 8 CPUs of step 01b,
      # ALIGN_MINIMAP2 (minimap2 piped into samtools) the process_high label's
      # 8 CPUs and 32 GB, MANTA, CNVPYTOR and VEP what steps 04, 18 and 13
      # give them, PRS_PREPARE 16 GB and PRS 24 GB (pgsc_calc's --max_memory)
      # for the nine default scores, and PRS_SCORE_SITES its label's 4 GB.
      #
      # The local executor is told it has more CPUs and memory than every task
      # attempt of this run asks for added together, and the check at the end
      # fails when it does not. So it accepts an 8-CPU stub on this 4-CPU
      # runner, and no task ever waits for room. The second part is why this
      # step no longer hangs. Nextflow before 26.10.0 keeps the local
      # executor's free CPUs and memory in two plain fields that two threads
      # change without a lock, so a release can be lost, and a task that asks
      # for more than the executor then counts as free is never started.
      # With executor.memory at 64 GB, the size of a doubled 32 GB request,
      # this step stopped that way in 22 of 600 loop runs, and twice in this
      # workflow's own runs, silent until the job timeout
      # (docs/lessons-learned.md, "The local executor can lose track of free
      # memory"). 26.10.0 fixes the race (nextflow-io/nextflow#7816); the
      # large executor stays so the step cannot hang on an older release.
      #
      # The trace can hold the same failed attempt twice. A stub task that
      # exits 137 at once can have its submit or start event handled after
      # its complete event, which puts it back in the trace's list of running
      # tasks, and Nextflow writes that list again when the run ends
      # (TraceFileObserver, still so in 26.10.x; docs/lessons-learned.md,
      # "The trace file can list a finished task twice"). So rows are keyed
      # by task_id: a repeated row must match the first (its exit status may
      # still read '-') and is counted once, and each task name must have
      # exactly one first attempt and one retry.
      - name: The heavy tasks ask for what the bash steps give them, and a retry doubles memory
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          exec_cpus=512 exec_mem_gb=2048
          cat > "${RUNNER_TEMP}/resources.config" <<CICONF
          params.kir = false
          executor.cpus = ${exec_cpus}
          executor.memory = '${exec_mem_gb}.GB'
          process.resourceLimits = [ cpus: 16, memory: '64.GB', time: '48.h' ]
          process {
              withName: 'DEEPVARIANT|FASTP|ALIGN_MINIMAP2|MANTA|CNVPYTOR|VEP|PRS_PREPARE|PRS_SCORE_SITES|PRS' {
                  beforeScript = { task.attempt == 1 ? 'exit 137' : 'true' }
              }
          }
          trace.enabled = true
          trace.raw = true
          trace.fields = 'task_id,name,attempt,exit,cpus,memory,time'
          timeline.enabled = false
          report.enabled = false
          dag.enabled = false
          CICONF
          nextflow run main.nf -profile test_all -stub -ansi-log false -c "${RUNNER_TEMP}/resources.config" \
            --tools vep,manta,cnvpytor,prs --max_cpus 16 --max_memory 64.GB --max_time 48.h \
            --outdir "${RUNNER_TEMP}/resources" -work-dir "${RUNNER_TEMP}/resources-work"
          python3 - "${RUNNER_TEMP}"/resources/pipeline_info/trace_*.txt "$exec_cpus" "$exec_mem_gb" <<'PY'
          import csv, sys
          GB, H = 1024 ** 3, 3600 * 1000
          exec_cpus, exec_mem = int(sys.argv[2]), int(sys.argv[3]) * GB
          # process: (cpus, memory, time) of the first attempt
          want = {
              'DEEPVARIANT':   (8, 32 * GB, 48 * H),
              'FASTP':         (8, 8 * GB, 8 * H),
              'ALIGN_MINIMAP2': (8, 32 * GB, 24 * H),
              'MANTA':         (8, 16 * GB, 24 * H),
              'CNVPYTOR':      (4, 8 * GB, 24 * H),
              'VEP':           (8, 16 * GB, 24 * H),
              'PRS_PREPARE':   (1, 16 * GB, 2 * H),
              'PRS_SCORE_SITES': (2, 4 * GB, 4 * H),
              'PRS':           (4, 24 * GB, 8 * H),
          }
          seen, bad = {p: {} for p in want}, 0
          attempts = all_cpus = all_mem = 0
          rows = {}
          with open(sys.argv[1]) as fh:
              for row in csv.DictReader(fh, delimiter='\t'):
                  first_row = rows.setdefault(row['task_id'], row)
                  if first_row is not row:
                      # The late copy can be built before the exit status was
                      # set, so it may read '-' there; nothing else may differ.
                      exits = {first_row['exit'], row['exit']} - {'-'}
                      if len(exits) > 1 or any(first_row[k] != row[k] for k in row if k != 'exit'):
                          print(f"FAIL: task {row['task_id']} has two different rows in the trace: {first_row} and {row}")
                          bad += 1
                      else:
                          print(f"{row['name']}: attempt {row['attempt']} is written twice in the trace; counted once")
                      continue
                  attempts += 1
                  all_cpus += int(row['cpus'])
                  all_mem += int(row['memory'])
                  proc = row['name'].split(' (')[0].split(':')[-1]
                  if proc not in want:
                      continue
                  got = (int(row['cpus']), int(row['memory']), int(row['time']))
                  print(f"{row['name']}: attempt {row['attempt']}, exit {row['exit']}, "
                        f"cpus {got[0]}, memory {got[1] / GB:g} GB, time {got[2] / H:g} h")
                  seen[proc].setdefault(int(row['attempt']), {}).setdefault(row['name'], []).append(got)
          for proc, (cpus, mem, time) in want.items():
              first, second = seen[proc].get(1, {}), seen[proc].get(2, {})
              unexpected = sorted(set(seen[proc]) - {1, 2})
              if unexpected:
                  print(f"FAIL {proc}: attempt(s) {unexpected} in the trace, want only a first attempt and one retry")
                  bad += 1
              if not first:
                  print(f"FAIL {proc}: no first attempt in the trace")
                  bad += 1
                  continue
              for name in sorted(set(first) | set(second)):
                  n1, n2 = len(first.get(name, [])), len(second.get(name, []))
                  if n1 != 1 or n2 != 1:
                      print(f"FAIL {name}: {n1} first and {n2} second attempts in the trace, want one of each")
                      bad += 1
              for got in (g for gs in first.values() for g in gs):
                  if got != (cpus, mem, time):
                      print(f"FAIL {proc}: first attempt asks for cpus {got[0]}, memory {got[1] / GB:g} GB, "
                            f"time {got[2] / H:g} h; want {cpus}, {mem / GB:g} GB, {time / H:g} h")
                      bad += 1
              for got in (g for gs in second.values() for g in gs):
                  if got[1] != 2 * mem:
                      print(f"FAIL {proc}: the retry asks for {got[1] / GB:g} GB, want {2 * mem / GB:g} GB")
                      bad += 1
          # Every attempt takes its request once and gives it back once. If
          # the executor has at least the sum, losing every release still
          # leaves room for the next task.
          print(f"{attempts} task attempts ask for {all_cpus} CPUs and {all_mem / GB:g} GB added together; "
                f"the executor is told it has {exec_cpus} CPUs and {exec_mem / GB:g} GB")
          if all_cpus > exec_cpus or all_mem > exec_mem:
              print("FAIL: executor.cpus or executor.memory of this step is below that sum; raise exec_cpus / exec_mem_gb")
              bad += 1
          print(f"{bad} failure(s)")
          sys.exit(1 if bad else 0)
          PY

      # The step above fakes the kill with beforeScript, so it cannot see how
      # ALIGN_MINIMAP2's own pipe reports one. This runs the module's real
      # script (no -stub, no Docker) with stand-ins for minimap2 and samtools
      # on PATH: on the first attempt minimap2 prints half a SAM record and
      # kills itself with SIGKILL, as the kernel does on out-of-memory, and
      # fixmate exits 1 on the cut record, as samtools 1.24 does. The task
      # must exit 137 and be retried with twice the memory; under pipefail
      # alone it exits 1 and the run stops.
      - name: ALIGN_MINIMAP2 is retried when minimap2 is killed for memory inside the pipe
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          t="${RUNNER_TEMP}/oom"
          mkdir -p "$t/bin"
          cat > "$t/bin/minimap2" <<EOF
          #!/bin/bash
          [ "\${1:-}" = --version ] && { echo 2.31-r1302; exit 0; }
          printf '@HD\tVN:1.6\n'
          if [ ! -e "$t/killed-once" ]; then
              touch "$t/killed-once"
              printf 'r1\t77\t*\t0\t0\t*\t*\t0\t0\tACGT'
              kill -9 \$\$
          fi
          printf 'r1\t77\t*\t0\t0\t*\t*\t0\t0\tACGT\tIIII\n'
          EOF
          cat > "$t/bin/samtools" <<'EOF'
          #!/bin/bash
          case "$1" in
              version) echo 'samtools 1.24' ;;
              fixmate) awk -F'\t' '!/^@/ && NF < 11 { bad = 1 } { print }
                  END { if (bad) { print "[E::sam_parse1] SEQ and QUAL are of different length" > "/dev/stderr"; exit 1 } }' ;;
              sort) cat ;;
              markdup) out="${*: -1}"; cat > "${out%%##idx##*}"; echo index > "${out#*##idx##}" ;;
              quickcheck) exit 0 ;;
              view) echo 0 ;;   # the read count: the empty FASTQs below hold no record
              *) echo "unexpected samtools $*" >&2; exit 2 ;;
          esac
          EOF
          chmod +x "$t/bin/minimap2" "$t/bin/samtools"
          touch "$t/r1.fastq.gz" "$t/r2.fastq.gz" "$t/ref.sr.mmi"
          cat > "$t/main.nf" <<EOF
          include { ALIGN_MINIMAP2 } from '${GITHUB_WORKSPACE}/modules/local/align_minimap2/main.nf'
          workflow {
              ALIGN_MINIMAP2(channel.of([[id: 'oom'], file('$t/r1.fastq.gz'), file('$t/r2.fastq.gz')]), file('$t/ref.sr.mmi'))
          }
          EOF
          # 16 CPUs and 128 GB: at least the two attempts added together (8 + 8
          # CPUs, 32 + 64 GB), for the reason given at the step above.
          cat > "$t/oom.config" <<EOF
          executor.cpus = 16
          executor.memory = '128.GB'
          trace.enabled = true
          trace.raw = true
          trace.file = '$t/trace.txt'
          trace.fields = 'task_id,name,attempt,exit,memory'
          timeline.enabled = false
          report.enabled = false
          dag.enabled = false
          EOF
          # Launched from the checkout, so its nextflow.config (shell,
          # errorStrategy, labels) applies.
          rc=0
          PATH="$t/bin:$PATH" nextflow run "$t/main.nf" -ansi-log false -c "$t/oom.config" \
            --max_cpus 16 --max_memory 64.GB --outdir "$t/out" -work-dir "$t/work" || rc=$?
          echo "nextflow exited ${rc}"
          cat "$t/trace.txt"
          python3 - "$t/trace.txt" "$rc" <<'PY'
          import csv, sys
          GB = 1024 ** 3
          # One row per task_id: the trace can list a finished task twice
          # (the retry step above says why), and the first row is the one
          # written when the task completed.
          # A repeated row must match the first; only its exit may read '-'.
          rows = {}
          for r in csv.DictReader(open(sys.argv[1]), delimiter='\t'):
              first = rows.setdefault(r['task_id'], r)
              exits = {first['exit'], r['exit']} - {'-'}
              if len(exits) > 1 or any(first[k] != r[k] for k in r if k != 'exit'):
                  print(f"FAIL: task {r['task_id']} has two different rows in the trace: {first} and {r}")
                  sys.exit(1)
          rows = [r for r in rows.values() if 'ALIGN_MINIMAP2' in r['name']]
          got = [(int(r['attempt']), r['exit'], int(r['memory']) // GB) for r in rows]
          want = [(1, '137', 32), (2, '0', 64)]
          print(f"ALIGN_MINIMAP2 attempts (attempt, exit, GB): {got}; want {want}")
          ok = sorted(got) == want and sys.argv[2] == '0'
          print('OK' if ok else 'FAIL: a kill inside the pipe did not reach Nextflow as exit 137 and a retry')
          sys.exit(0 if ok else 1)
          PY

      # PRS runs pgsc_calc, a Nextflow pipeline of its own, and gives it the
      # task's memory as --max_memory, the most one pgsc_calc task may have. A
      # pgsc_calc task killed under that cap ends pgsc_calc with exit 1, which
      # is not retried. This runs the module's real script (no -stub) on a
      # stand-in for pgsc_calc whose FORMAT_SCOREFILES needs 32 GB and asks as
      # pgsc_calc v2.3.0's does (2 CPUs and 16 GB times the attempt, up to two
      # retries on a kill). Under 32 GB it ends in one of the two ways the
      # real one did on the default score list: for the sample named sigkill
      # it is killed with SIGKILL, for the sample named pool it prints
      # Python's BrokenProcessPool and exits 1. Each PRS task must exit 137,
      # be retried with twice the memory (24, then 48 GB) and pass: so PRS
      # has to give FORMAT_SCOREFILES one CPU, all of its memory and no retry
      # inside pgsc_calc, or the stand-in exits 2 (it checks all three).
      - name: PRS is retried with twice the memory when a pgsc_calc task is killed for memory
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          t="${RUNNER_TEMP}/prs-oom"
          mkdir -p "$t/pgsc_calc" "$t/pgs"
          cat > "$t/pgsc_calc/main.nf" <<'EOF'
          process FORMAT_SCOREFILES {
              input:
              val mode

              script:
              """
              [ ${task.attempt} -eq 1 ] || { echo "FORMAT_SCOREFILES retried inside pgsc_calc" >&2; exit 2; }
              [ ${task.cpus} -eq 1 ] || { echo "FORMAT_SCOREFILES has ${task.cpus} CPUs, want 1" >&2; exit 2; }
              case ${task.memory.toGiga()} in
                  24|48) ;;
                  *) echo "FORMAT_SCOREFILES has ${task.memory.toGiga()} GB, want all of PRS's 24 or 48 GB" >&2; exit 2 ;;
              esac
              if [ ${task.memory.toGiga()} -lt 32 ]; then
                  if [ ${mode} = sigkill ]; then kill -9 \$\$; fi
                  # Split in two: pgsc_calc prints a failed task's script, and
                  # the whole word there would read as a kill in PRS's check.
                  echo 'concurrent.futures.process.Broken''ProcessPool: A process in the process pool was terminated abruptly' >&2
                  exit 1
              fi
              echo "formatted with ${task.memory.toGiga()} GB"
              """
          }
          workflow {
              FORMAT_SCOREFILES(file(params.input).text.contains('sigkill') ? 'sigkill' : 'pool')
          }
          EOF
          # The executor is told it has more than every attempt added
          # together, for the reason given at the resources step above.
          cat > "$t/pgsc_calc/nextflow.config" <<'EOF'
          params {
              input        = null
              target_build = null
              scorefile    = null
              outdir       = null
              max_cpus     = 16
              max_memory   = '128.GB'
          }
          profiles { docker { docker.enabled = false } }
          executor.cpus = 64
          executor.memory = '512.GB'
          process {
              resourceLimits = [ memory: params.max_memory as nextflow.util.MemoryUnit ]
              cpus   = 2
              memory = { 16.GB * task.attempt }
              errorStrategy = { task.exitStatus in ((130..145) + 104) ? 'retry' : 'finish' }
              maxRetries = 2
          }
          EOF
          for s in sigkill pool; do
            printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\t%s\nchr1\t1\t.\tA\tC\t.\t.\t.\tGT\t0/1\n' "$s" \
              | gzip -c > "$t/${s}.vcf.gz"
          done
          touch "$t/pgs/PGS000000.txt.gz"
          cat > "$t/main.nf" <<EOF
          include { PRS } from '${GITHUB_WORKSPACE}/modules/local/prs/main.nf'
          workflow {
              PRS(channel.of('sigkill', 'pool').map { s -> [[id: s], file("$t/\${s}.vcf.gz"), 'gvcf', file('$t/pgs')] }, [])
          }
          EOF
          # 32 CPUs and 256 GB: more than the four attempts added together
          # (4 CPUs each, 24 + 48 GB per sample).
          cat > "$t/oom.config" <<EOF
          executor.cpus = 32
          executor.memory = '256.GB'
          trace.enabled = true
          trace.raw = true
          trace.file = '$t/trace.txt'
          trace.fields = 'task_id,name,attempt,exit,memory'
          timeline.enabled = false
          report.enabled = false
          dag.enabled = false
          EOF
          # Launched from the checkout, so its nextflow.config (errorStrategy,
          # the PRS request, pgsc_calc's images) applies.
          rc=0
          nextflow run "$t/main.nf" -ansi-log false -c "$t/oom.config" --pgsc_calc "$t/pgsc_calc" \
            --max_cpus 16 --max_memory 64.GB --outdir "$t/out" -work-dir "$t/work" || rc=$?
          echo "nextflow exited ${rc}"
          cat "$t/trace.txt"
          python3 - "$t/trace.txt" "$rc" <<'PY'
          import csv, sys
          GB = 1024 ** 3
          # One row per task_id, as in the ALIGN_MINIMAP2 step above.
          rows = {}
          for r in csv.DictReader(open(sys.argv[1]), delimiter='\t'):
              first = rows.setdefault(r['task_id'], r)
              exits = {first['exit'], r['exit']} - {'-'}
              if len(exits) > 1 or any(first[k] != r[k] for k in r if k != 'exit'):
                  print(f"FAIL: task {r['task_id']} has two different rows in the trace: {first} and {r}")
                  sys.exit(1)
          rows = list(rows.values())
          want, ok = [(1, '137', 24), (2, '0', 48)], sys.argv[2] == '0'
          for sample in ('sigkill', 'pool'):
              got = sorted((int(r['attempt']), r['exit'], int(r['memory']) // GB) for r in rows if r['name'] == f'PRS ({sample})')
              print(f"PRS ({sample}) attempts (attempt, exit, GB): {got}; want {want}")
              ok = ok and got == want
          print('OK' if ok else 'FAIL: a memory kill inside pgsc_calc did not reach Nextflow as exit 137 and a retry that passes')
          sys.exit(0 if ok else 1)
          PY

      # A Nextflow run that fails, or that its step's timeout cuts, leaves its
      # log in the checkout as .nextflow.log (older runs of the job as
      # .nextflow.log.1 and up). The first two hangs of the retry step could
      # not be explained because CI kept none. Nextflow writes its two queues
      # to that log every five minutes, so a run cut after ten has them:
      # "tasks in the submission queue" wait to start, "tasks to be completed"
      # are running.
      - name: Show what Nextflow was waiting for
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          log=.nextflow.log
          [ -f "$log" ] || { echo "No .nextflow.log: no Nextflow run had started."; exit 0; }
          # A report, not a check: no command here may stop the step, and a
          # log that cannot be copied (a full disk) must not cost the report.
          mkdir -p "${RUNNER_TEMP}/nextflow-logs" || true
          for f in .nextflow.log*; do cp "$f" "${RUNNER_TEMP}/nextflow-logs/${f#.}" || echo "Could not keep $f for the artifact."; done
          names() { sed -n "$1" "$log" | sort; }
          echo "The newest run, $(grep -m1 -o '\$> .*' "$log" || echo 'command line not found')"
          echo "== Submitted and not completed (running when the log ends):"
          comm -23 <(names 's/.*ubmitted process > \(.*\)$/\1/p') \
                   <(names 's/.*Task completed > TaskHandler\[id: [0-9]*; name: \(.*\); status: .*/\1/p') || true
          echo "== Retried and never re-submitted (waiting to start):"
          comm -23 <(names 's/.*NOTE: Process .\(.*\). terminated.*Execution is retried.*/\1/p') \
                   <(names 's/.*Re-submitted process > \(.*\)$/\1/p') || true
          echo "== Nextflow's own queue dumps (one every five minutes; none in a shorter run):"
          dumps=$(grep -E '(%%|!!) executor |^~> |^\.\. remaining' "$log" | tail -n 40 || true)
          echo "${dumps:-none}"

      - name: Keep the Nextflow logs of a failed job
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextflow-logs-${{ matrix.line }}
          path: ${{ runner.temp }}/nextflow-logs
          if-no-files-found: ignore
          retention-days: 14
