name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      # The tag comes from the dispatch form or the pushed ref, so it is
      # untrusted text: it reaches the shell through env only, and it must
      # look like vMAJOR.MINOR.PATCH before anything else runs.
      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          else
            tag=${GITHUB_REF#refs/tags/}
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: the tag is not of the form vMAJOR.MINOR.PATCH (not echoed: it is untrusted text)" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is named after the version the pipeline reports, so the tag
      # must equal manifest.version in nextflow.config at the tagged commit,
      # and a major or minor release needs its curated notes,
      # docs/releases/<tag>.md, which become the release body.
      - name: The tag matches manifest.version, and the notes exist
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/ci/check-release.sh tag "$TAG" --notes-out "${RUNNER_TEMP}/notes.md"

      # Only a commit that main's CI passed is released: it must be on main,
      # and every check run on it (this job left out) must have finished green.
      - name: The tagged commit is on main and its checks passed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse "${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "ERROR: ${TAG} (${sha}) is not a commit on main" >&2
            exit 1
          fi
          gh api --paginate "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv' > "${RUNNER_TEMP}/runs.tsv"
          scripts/ci/check-release.sh checks "${RUNNER_TEMP}/runs.tsv" --ignore "$GITHUB_JOB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          draft: false
