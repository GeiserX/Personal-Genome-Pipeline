name: Container Test

# Runs each pinned image of versions.env on the e2e fixture (a slice of the
# public GIAB HG002 genome, see docs/testing.md) and checks what the tool
# wrote, so a bump that breaks a tool turns the pull request red. A row of
# tests/smoke/commands.tsv says what each image runs and what it must write;
# scripts/ci/image-smoke.sh runs the rows. The jobs:
#
#   plan          picks the images (scripts/ci/changed-images.sh): on a pull
#                 request the variables whose value changed, every image when
#                 the test itself changed; monthly and on dispatch every image.
#                 It also fails when an image has no row, so a new image cannot
#                 be added untested.
#   manifest      `docker manifest inspect` on every pinned image: metadata
#                 only, seconds per image, and it catches a digest the
#                 publisher removed. It resolves the pinned digest alone, so a
#                 tag rebuilt in place stays green (Renovate repins it). It
#                 prints the platforms each image ships. A self-test first
#                 proves a moved tag passes and a missing digest fails.
#                 Skipped when plan picked no image.
#   smoke         one job per picked image: free disk, prepare the inputs its
#                 rows need, pull it, run the rows, check the outputs.
#   pinned-images runs setup.sh --pull-only on the images versions.env pins
#                 by digest and checks that none is left dangling (no tag), so
#                 `docker image prune` keeps them, and that validate-setup.sh
#                 reports a missing tag the way the image store answers. Two
#                 legs: Docker's classic image store and its containerd image
#                 store (the default for fresh installs since Engine 29). On a
#                 pull request it pulls
#                 only when versions.env, setup.sh, validate-setup.sh,
#                 scripts/lib/common.sh or this file changed; otherwise the job
#                 passes without pulling. Monthly and on dispatch it always runs.
#   container-ok  one result for the whole run, so a branch rule can require
#                 it: green only when plan, manifest and pinned-images passed
#                 and every picked image passed. It runs on every pull request (no paths filter;
#                 plan takes seconds and the other jobs are skipped when
#                 nothing changed), so requiring it never leaves a pull request
#                 waiting on a check that does not start.
#
# Rows marked `full` (AnnotSV with its 5.3 GB annotation data) run monthly and
# on dispatch only. When the monthly run fails, the freshness job opens or
# comments on one issue labelled `freshness`, titled "Monthly image test
# failed".
#
# Public repo: GitHub-hosted runners are free here, and this runs on pull
# requests, so nothing in this file may use a self-hosted runner.
on:
  pull_request:
    branches: [main]
  schedule:
    # Monthly: catches an image that was removed or no longer runs.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      images:
        description: 'all, changed (against main), or *_IMAGE names separated by spaces'
        type: string
        default: all
      full:
        description: 'Also run the rows marked full (AnnotSV on its 5.3 GB data)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.pick.outputs.images }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Self-tests (planted changes and planted table faults must be caught)
        run: |
          scripts/ci/changed-images.sh --self-test
          scripts/ci/image-smoke.sh --self-test

      - name: Every image has a row, and every row parses
        run: scripts/ci/image-smoke.sh --check

      - name: Pick the images
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          IMAGES_IN: ${{ inputs.images }}
          FULL_IN: ${{ inputs.full }}
        run: |
          full=false
          case "$EVENT" in
            pull_request)
              # The checkout is the merge commit: its first parent is main.
              list=$(scripts/ci/changed-images.sh HEAD^1) ;;
            workflow_dispatch)
              full=${FULL_IN:-true}
              case "${IMAGES_IN:-all}" in
                all) list=$(scripts/ci/changed-images.sh --all) ;;
                changed) list=$(scripts/ci/changed-images.sh "$(git merge-base origin/main HEAD)") ;;
                *)
                  all=$(scripts/ci/changed-images.sh --all)
                  list=""
                  for v in $IMAGES_IN; do
                    grep -qx -- "$v" <<< "$all" || { echo "::error::${v} is not an *_IMAGE variable of versions.env"; exit 1; }
                    list+="${v}"$'\n'
                  done ;;
              esac ;;
            *)
              full=true
              list=$(scripts/ci/changed-images.sh --all) ;;
          esac
          json=$(grep . <<< "$list" | jq -R . | jq -cs . || echo '[]')
          echo "images=${json}" >> "$GITHUB_OUTPUT"
          echo "full=${full}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images to run (full rows: ${full})"
            echo
            if [ "$json" = "[]" ]; then echo "None: no image changed."; else grep . <<< "$list" | sed 's/^/- /'; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test (a moved tag passes, a missing digest fails)
        run: scripts/ci/image-smoke.sh --manifest-self-test

      - name: Every pinned image still exists
        if: ${{ !cancelled() }}
        run: scripts/ci/image-smoke.sh --manifest

  smoke:
    needs: plan
    if: needs.plan.outputs.images != '[]'
    name: smoke (${{ matrix.var }})
    runs-on: ubuntu-latest
    # The longest rows (GRIDSS, AnnotSV with its data download) take about an
    # hour; ROW_TIMEOUT stops a single row first.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        var: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Images go to /var/lib/docker on /; the work area goes to whichever of
      # / and /mnt has more room, so the two do not compete for one disk.
      - name: Free disk space and pick the work area
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt
          work="${RUNNER_TEMP}/image-smoke"
          if [ "$(df --output=avail -k /mnt | tail -1)" -gt "$(df --output=avail -k / | tail -1)" ]; then
            work=/mnt/image-smoke
            sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          fi
          echo "SMOKE_WORK=${work}" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.var }} on the fixture
        env:
          GH_TOKEN: ${{ github.token }}
          VAR: ${{ matrix.var }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          flag=()
          [ "$FULL" = "true" ] && flag=(--full)
          scripts/ci/image-smoke.sh "${flag[@]}" "$VAR"

      - name: Upload row logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-smoke-logs-${{ matrix.var }}
          path: ${{ env.SMOKE_WORK }}/logs/
          if-no-files-found: ignore

  # On the classic image store an image pulled by digest alone has no tag:
  # Docker lists it as dangling and a dangling-image cleanup
  # (`docker image prune`) deletes it. On the containerd image store the
  # digest reference is the image's name, so Docker does not list it as
  # dangling and the cleanup keeps it. setup.sh gives each digest-pinned
  # image a second name either way (pinned_tag in scripts/lib/common.sh);
  # tasks keep running the digest reference.
  pinned-images:
    name: pinned-images (${{ matrix.store }} store)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: [classic, containerd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request that changes none of these files cannot change the
      # result, so it does not pull from the registries. A failed or missing
      # answer runs the check (the test below is != 'false').
      - name: Does this pull request touch the pinned images or setup
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "${BASE}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed.txt"
          if grep -qxE 'versions\.env|scripts/setup\.sh|scripts/validate-setup\.sh|scripts/lib/common\.sh|\.github/workflows/container-test\.yml' "${RUNNER_TEMP}/changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the pinned-image check exercises changed: it is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Each leg sets the image store itself, so the runner's default does
      # not decide what is tested, and proves the daemon took it.
      - name: Use the ${{ matrix.store }} image store
        if: steps.scope.outputs.run != 'false'
        env:
          STORE: ${{ matrix.store }}
        run: |
          on=false
          [ "$STORE" = containerd ] && on=true
          f=/etc/docker/daemon.json
          cur='{}'
          if sudo test -s "$f"; then cur=$(sudo cat "$f"); fi
          jq --argjson on "$on" '.features["containerd-snapshotter"] = $on' <<< "$cur" | sudo tee "$f"
          sudo systemctl restart docker
          docker version --format 'Docker server {{.Server.Version}}'
          status=$(docker info --format '{{.Driver}} {{json .DriverStatus}}')
          echo "Storage driver: ${status}"
          if grep -q 'io.containerd.snapshotter' <<< "$status"; then got=containerd; else got=classic; fi
          if [ "$got" != "$STORE" ]; then
            echo "::error::asked for the ${STORE} image store, docker info reports the ${got} one"; exit 1
          fi

      - name: setup.sh --pull-only leaves no digest-pinned image dangling
        if: steps.scope.outputs.run != 'false'
        env:
          STORE: ${{ matrix.store }}
        run: |
          mapfile -t imgs < <(bash -c '. scripts/lib/common.sh && pipeline_images' | grep '@sha256:')
          if [ "${#imgs[@]}" -eq 0 ]; then
            echo "::error::versions.env pins no image by digest that setup.sh pulls; nothing to check"; exit 1
          fi
          printf 'Digest-pinned: %s\n' "${imgs[@]}"
          id_of() { docker image inspect --format '{{.Id}}' "$1"; }
          is_dangling() { docker images --no-trunc --quiet --filter dangling=true | grep -qx "$(id_of "$1")"; }

          # A copy whose pull list holds only the digest-pinned images.
          copy="${RUNNER_TEMP}/repo"
          mkdir -p "$copy"
          cp -R scripts versions.env "$copy/"
          awk '/^[A-Z0-9_]+_IMAGE=/ && !/@sha256:/ && !/# optional/ { $0 = $0 "  # optional" } 1' \
            versions.env > "${copy}/versions.env"
          # validate-setup.sh lists an image alone on a line under its
          # warning (dangling: a cleanup would delete it) or under its note
          # (not dangling, only the pinned tag is missing). It exits 1 here
          # (no reference data): ignored.
          listed() {
            "${copy}/scripts/validate-setup.sh" > "${RUNNER_TEMP}/validate.log" 2>&1 || true
            awk -v i="$1" -v start="$2" -v stop="$3" '$0 ~ start { w = 1; next } $0 ~ stop { w = 0 }
              w && NF == 1 && $1 == i { f = 1 } END { exit !f }' "${RUNNER_TEMP}/validate.log"
          }
          warned() { listed "$1" 'digest-pinned image[(]s[)] have no local tag' 'Tag them with'; }
          noted() { listed "$1" 'lack their localhost/pgp-pinned/ tag; Docker does not list them as dangling, so a dangling-image cleanup keeps them:' 'Add it with'; }
          # untagged: the report validate-setup.sh owes an image whose pinned
          # tag is missing and which has no other tag: the warning where that
          # image is dangling (classic store), the note where it is not.
          untagged() { if [ "$STORE" = classic ]; then warned "$1"; else noted "$1"; fi; }
          # pull_only N: setup.sh --pull-only, whose summary must say it added N pinned tags.
          pull_only() {
            "${copy}/scripts/setup.sh" --pull-only > "${RUNNER_TEMP}/setup.log" 2>&1 || { cat "${RUNNER_TEMP}/setup.log"; exit 1; }
            cat "${RUNNER_TEMP}/setup.log"
            if ! grep -qE "^\[OK\] Docker images: .*, $1 pgp-pinned tag\(s\) added\.$" "${RUNNER_TEMP}/setup.log"; then
              echo "::error::setup.sh --pull-only should report $1 pgp-pinned tag(s) added"; exit 1
            fi
          }

          # Control: pulled by digest the plain way. On the classic store the
          # first image is dangling, so the check below can fail, and
          # validate-setup.sh warns about it. On the containerd store it is
          # not dangling, validate-setup.sh only notes the missing tag, and a
          # dangling-image cleanup keeps it.
          docker pull --quiet "${imgs[0]}"
          echo "${STORE} store: ${imgs[0]} pulled by digest alone is listed as: $(docker images --no-trunc --format '{{.Repository}} {{.Tag}} {{.ID}}' | grep -F "$(id_of "${imgs[0]}")" || echo 'not listed')"
          if [ "$STORE" = classic ]; then
            if ! is_dangling "${imgs[0]}"; then
              echo "::error::control: ${imgs[0]} pulled by digest alone is not dangling; this check could not fail"; exit 1
            fi
            echo "Control: ${imgs[0]} pulled by digest alone is dangling."
            if ! warned "${imgs[0]}"; then
              cat "${RUNNER_TEMP}/validate.log"
              echo "::error::validate-setup.sh did not warn that ${imgs[0]} has no local tag"; exit 1
            fi
            echo "validate-setup.sh warns that ${imgs[0]} has no local tag."
          else
            if is_dangling "${imgs[0]}"; then
              echo "::error::control: on the containerd store ${imgs[0]} pulled by digest alone is dangling; validate-setup.sh's note assumes it is not"; exit 1
            fi
            echo "Control: ${imgs[0]} pulled by digest alone is not dangling."
            if warned "${imgs[0]}" || ! noted "${imgs[0]}"; then
              cat "${RUNNER_TEMP}/validate.log"
              echo "::error::validate-setup.sh should note, not warn, that ${imgs[0]} lacks its pinned tag and is not dangling"; exit 1
            fi
            echo "validate-setup.sh notes that ${imgs[0]} lacks its pinned tag and is not dangling."
            docker image prune --force
            docker image inspect "${imgs[0]}" > /dev/null || { echo "::error::docker image prune deleted ${imgs[0]}, pulled by digest alone"; exit 1; }
            echo "docker image prune kept ${imgs[0]}, pulled by digest alone."
          fi

          # setup.sh: the first image takes the "already present" path, the
          # rest are pulled. Run twice: the first adds every pinned tag, the
          # second must change nothing.
          for run in 1 2; do
            if [ "$run" -eq 1 ]; then pull_only "${#imgs[@]}"; else pull_only 0; fi
            for img in "${imgs[@]}"; do
              if is_dangling "$img"; then
                echo "::error::run ${run}: ${img} is dangling after setup.sh --pull-only; docker image prune would delete it"; exit 1
              fi
            done
          done
          echo "No digest-pinned image is dangling after setup.sh --pull-only."
          if warned "${imgs[0]}" || noted "${imgs[0]}"; then
            echo "::error::validate-setup.sh still reports ${imgs[0]} after setup.sh --pull-only"; exit 1
          fi

          # One local tag per image, carrying its digest, on the same image id.
          for img in "${imgs[@]}"; do
            mapfile -t tags < <(docker image inspect --format '{{range .RepoTags}}{{println .}}{{end}}' "$img" | grep '^localhost/pgp-pinned/')
            if [ "${#tags[@]}" -ne 1 ] || [[ "${tags[0]}" != *":sha256-${img##*@sha256:}" ]]; then
              echo "::error::${img} should have one localhost/pgp-pinned/ tag carrying its digest, has: ${tags[*]:-none}"; exit 1
            fi
            [ "$(id_of "${tags[0]}")" = "$(id_of "$img")" ] || { echo "::error::${tags[0]} is not the image ${img}"; exit 1; }
            echo "${img} -> ${tags[0]}"
          done

          # The cleanup itself: every image is still there, by its digest reference.
          docker image prune --force
          for img in "${imgs[@]}"; do
            docker image inspect "$img" > /dev/null || { echo "::error::docker image prune deleted ${img}"; exit 1; }
          done
          echo "docker image prune kept all ${#imgs[@]} digest-pinned images."

          # A tag moved to another image does not protect the first one:
          # validate-setup.sh compares image ids, and setup.sh moves it back.
          if [ "${#imgs[@]}" -ge 2 ]; then
            tag0=$(docker image inspect --format '{{range .RepoTags}}{{println .}}{{end}}' "${imgs[0]}" | grep '^localhost/pgp-pinned/')
            docker tag "${imgs[1]}" "$tag0"
            if ! untagged "${imgs[0]}"; then
              cat "${RUNNER_TEMP}/validate.log"
              echo "::error::validate-setup.sh missed that ${tag0} names another image"; exit 1
            fi
            pull_only 1
            [ "$(id_of "$tag0")" = "$(id_of "${imgs[0]}")" ] || { echo "::error::setup.sh did not move ${tag0} back"; exit 1; }
            if warned "${imgs[0]}" || noted "${imgs[0]}"; then
              echo "::error::validate-setup.sh still reports ${imgs[0]} after setup.sh moved its tag back"; exit 1
            fi
            echo "A moved tag is reported by validate-setup.sh and put back by setup.sh."
          fi

          # Another local tag on the same image id keeps it from being
          # dangling: validate-setup.sh must not claim a cleanup would delete
          # it, and notes that the pinned tag is missing.
          tag0=$(docker image inspect --format '{{range .RepoTags}}{{println .}}{{end}}' "${imgs[0]}" | grep '^localhost/pgp-pinned/')
          docker tag "${imgs[0]}" example/foreign:keep
          docker rmi "$tag0"
          if is_dangling "${imgs[0]}"; then
            echo "::error::control: ${imgs[0]} with another tag is dangling; this case tests nothing"; exit 1
          fi
          if warned "${imgs[0]}"; then
            cat "${RUNNER_TEMP}/validate.log"
            echo "::error::validate-setup.sh claims a cleanup would delete ${imgs[0]}, which another tag keeps"; exit 1
          fi
          if ! noted "${imgs[0]}"; then
            cat "${RUNNER_TEMP}/validate.log"
            echo "::error::validate-setup.sh did not note that ${imgs[0]} lacks its pinned tag"; exit 1
          fi
          pull_only 1
          echo "An image kept by another tag is noted, not called deletable, and setup.sh adds its pinned tag."

  container-ok:
    needs: [plan, manifest, smoke, pinned-images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plan and manifest passed, and every picked image passed
        env:
          PLAN: ${{ needs.plan.result }}
          MANIFEST: ${{ needs.manifest.result }}
          SMOKE: ${{ needs.smoke.result }}
          PINNED: ${{ needs.pinned-images.result }}
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          echo "plan=${PLAN} manifest=${MANIFEST} smoke=${SMOKE} pinned-images=${PINNED} images=${IMAGES:-<none>}"
          if [ "$PLAN" != success ]; then
            echo "::error::plan did not succeed (${PLAN})"; exit 1
          fi
          if [ "$PINNED" != success ]; then
            echo "::error::pinned-images did not succeed (${PINNED})"; exit 1
          fi
          if [ "$IMAGES" = "[]" ]; then
            # Nothing picked: manifest and smoke are skipped by design.
            echo "No image changed."; exit 0
          fi
          if [ "$MANIFEST" != success ] || [ "$SMOKE" != success ]; then
            echo "::error::images were picked, but manifest=${MANIFEST} smoke=${SMOKE}"; exit 1
          fi
          echo "Every picked image passed."

  freshness:
    needs: [plan, manifest, smoke, pinned-images]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or update the freshness issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          R="$GITHUB_REPOSITORY"
          failed=$(gh api "repos/${R}/actions/runs/${RUN_ID}/jobs" --paginate \
                     --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          body=$(printf 'The monthly image test failed on %s.\n\nFailed jobs:\n%s\n\nRun: %s\n\nEach job log names the row and the check that failed; the row logs are in the image-smoke-logs-* artifacts of the run.\n' \
                   "$(date -u +%Y-%m-%d)" "${failed:-(none reported)}" "$RUN_URL")
          title="Monthly image test failed"
          gh label create freshness -R "$R" --color c5def5 \
            --description "A pinned image, database or link has gone stale" 2>/dev/null || true
          # Found by its title: the freshness workflow keeps its own issue
          # under the same label, and this job never touches that one.
          n=$(TITLE="$title" gh issue list -R "$R" --label freshness --state open --json number,title \
                --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$R" --body "$body"
          else
            gh issue create -R "$R" --label freshness --title "$title" --body "$body"
          fi
