name: Container Smoke Test

on:
  push:
    branches: [main]
    paths: ['versions.env', 'scripts/setup.sh', '.github/workflows/container-test.yml']
  pull_request:
    branches: [main]
    paths: ['versions.env', 'scripts/setup.sh', '.github/workflows/container-test.yml']
  workflow_dispatch:
  schedule:
    # Monthly check that upstream images are still pullable
    - cron: '0 6 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Representative subset — one per registry/publisher to catch auth/rename issues
          - image: staphb/bcftools:1.21
            cmd: "bcftools --version"
          - image: quay.io/biocontainers/minimap2:2.31--h118bc1c_0
            cmd: "minimap2 --version"
          - image: brentp/duphold:v0.2.3
            cmd: "duphold --version"
          - image: quay.io/biocontainers/annotsv:3.5.10--hdfd78af_0
            cmd: "AnnotSV --version"
          - image: broadinstitute/picard:3.4.0
            cmd: "java -version"
          - image: pgkb/pharmcat:3.2.0
            cmd: "pharmcat_pipeline --version"
          - image: python:3.11
            cmd: "python3 --version"
          - image: quay.io/biocontainers/vcfanno:0.3.9--h1079eea_0
            cmd: "bash -c 'vcfanno 2>&1 | grep -q \"vcfanno version\"'"
          # slivar uses staphb/bcftools + pre-built binary (no dedicated container)
          - image: quay.io/biocontainers/pypgx:0.26.0--pyh7e72e81_0
            cmd: "pypgx --version"
          # Images only the bash steps use; they came into versions.env with
          # scripts/lib/common.sh.
          - image: quay.io/biocontainers/bwa-mem2:2.2.1--hd03093a_5
            cmd: "bwa-mem2 version"
          - image: quay.io/biocontainers/bwa:0.7.18--he4a0461_1
            cmd: "bash -c 'bwa 2>&1 | grep -q \"Version: 0.7.18\"'"
          - image: quay.io/biocontainers/freebayes:1.3.6--hbfe0e7f_2
            cmd: "freebayes --version"
          - image: quay.io/biocontainers/strelka:2.9.10--h9ee0642_1
            cmd: "configureStrelkaGermlineWorkflow.py --version"
          - image: quay.io/biocontainers/tiddit:3.9.5--py312h6e8b409_0
            cmd: "bash -c 'tiddit 2>&1 | grep -qi usage'"
          - image: jmcdani20/hap.py:v0.3.12
            cmd: "/opt/hap.py/bin/hap.py --version"
          # Digest-pinned images (publishers ship no versioned tags) — the monthly
          # run catches digest rot / an unpullable digest.
          - image: lgalarno/telomerehunter@sha256:6d53ac63c3ae50aa036652136c60043fb1e9abfcbbdc7ccd7fdae1fdb3541714
            cmd: "telomerehunter --help"
          - image: jtb114/haplogrep3@sha256:7b28d98a0ffb801977bcc0597941259cf2c4dbe4e89756a9a2c4809c3c9c78de
            cmd: "haplogrep3 trees"
    steps:
      - name: Pull ${{ matrix.image }}
        run: docker pull "${{ matrix.image }}"

      - name: Verify ${{ matrix.image }}
        run: docker run --rm "${{ matrix.image }}" ${{ matrix.cmd }}

  versions-env-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify smoke-test matrix matches versions.env
        run: |
          echo "Checking that container-test matrix images exist in versions.env..."
          rm -f /tmp/matrix_fail

          # Extract only "- image: <value>" lines from the YAML matrix block
          # These always start with leading whitespace, a dash, and "image:"
          grep -E '^\s+- image:' .github/workflows/container-test.yml | awk '{print $3}' | while read -r img; do
            if ! grep -qF "$img" versions.env; then
              echo "FAIL: container-test.yml matrix has $img but it's not in versions.env"
              echo "1" > /tmp/matrix_fail
            fi
          done

          if [ -f /tmp/matrix_fail ]; then
            exit 1
          fi
          echo "OK: All matrix images exist in versions.env"
