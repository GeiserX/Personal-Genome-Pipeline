name: Docs

# The repository had no Pages site before this workflow. Pages is switched on
# once with
# `gh api -X POST repos/GeiserX/OwnGenome/pages -f build_type=workflow`,
# so the source is "GitHub Actions" and there is no gh-pages branch. Until
# then the deploy job fails, which is the test that the switch happened.
#
# Pull requests that touch the docs run the strict build, so a broken link, a
# missing page or an unreachable page fails the check instead of reaching the
# site. A push to main deploys, and only after the same build has passed.
#
# The site is published as a Pages artifact, never with `mkdocs gh-deploy`:
# no gh-pages branch, no `contents: write`, and one artifact is the whole site.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # The live-site demo at /demo/ is built from these (tests/demo/build_live_demo.py).
      # assets/** because render_report.py also reads the gene and rule tables there.
      - 'assets/**'
      - 'bin/**'
      - 'tests/demo/**'
      - 'tests/fixtures/live/**'
  # No paths filter on pull requests, on purpose: a check skipped by a path
  # filter stays Pending and blocks the merge once it is a required check
  # (repos.md step 5 makes green checks required). The build takes seconds.
  pull_request:
  workflow_dispatch:

# One run at a time per ref, and a running deploy is never cancelled. Locking
# only the deploy job is not enough: an older push whose build finishes later
# would deploy last and publish a stale site. GitHub does not promise push order
# for runs waiting on the lock, so in a rare race an older commit can still be
# published; the next push to the docs corrects it. Pull requests get their own
# group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    # Public repo: GitHub-hosted runners are free and unlimited here, and the
    # job runs on pull requests, so it must never touch a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; a persisted token is readable by pip and every MkDocs plugin.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      # mkdocs.yml sets `strict: true`; the flag here keeps the build strict
      # even if someone removes that line.
      - name: Build
        run: mkdocs build --strict

      # /demo/: the live site replaying an invented run of DEMO-001, the invented
      # sample of the docs pictures, through the real page and plugin code
      # (tests/demo/build_live_demo.py; standard library only). It is a static
      # folder beside the pages, not a page of the nav.
      - name: Add the live-site demo
        run: |
          python3 tests/demo/build_live_demo.py --out site/demo
          test -s site/demo/runs/DEMO-001/frames.json

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Runs on push to main only, after the build job has passed.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
