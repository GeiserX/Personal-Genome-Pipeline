name: Freshness

# Once a month this workflow keeps one issue, labelled `freshness`, that says
# which pinned databases, bundles, images and download links have fallen
# behind upstream or stopped answering. Renovate bumps image tags; this covers
# what it cannot see (the Ensembl cache release, the PCGR bundle date, the
# pypgx-bundle tag, the Nextflow line, the ClinVar file date) and lists the
# major updates Renovate does not open on its own.
#
# The issue is found by a marker in its body, not by the label alone, so an
# issue another workflow files under the same label is never overwritten. A
# closed report is reopened rather than duplicated. The stale workflow exempts
# the `freshness` label, and this run edits the issue every month anyway.
#
# The run goes red when a lookup fails (an empty or failed answer is an
# error, never "current"), a download link does not answer 200, or a PGS ID's
# label names another trait. The issue is written first, so it says why.
#
# Pull requests that touch scripts/ or docs/ get the parts that fail fast: the
# download URLs the change adds, the PGS labels when scripts/25-prs.sh changes,
# and a dry run of the report when its own code or versions.env changes. The
# whole-tree link check runs monthly, so a link that dies upstream shows in the
# issue instead of failing an unrelated pull request.
#
# 60-day rule: GitHub disables scheduled workflows in a public repository after
# 60 days without repository activity. Monthly Dependabot and Renovate merges
# normally count as activity. As a fallback the report job re-enables this
# workflow through the API when the newest commit on the default branch is
# older than 25 days. The threshold is under one cron interval so that one
# monthly run always lands before day 60: with 45 a commit made just after a
# run would next be seen at day 61, after the schedule is already off. The
# enable call is GitHub's documented way to re-enable a workflow; that it also
# resets the 60-day timer has not yet been watched over a full quiet window
# here, so until it has, do not rely on it alone.

on:
  schedule:
    # The 2nd at 05:17 UTC: after the monthly image test on the 1st.
    - cron: '17 5 2 * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'versions.env'
      - '.github/workflows/freshness.yml'

permissions:
  contents: read

# An explicit shell runs every step with -o pipefail, so `check | tee` fails
# when the check fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each check proves it can fail before its answer is trusted.
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: freshness.py self-test (a bogus image, a missing tag and a bogus URL must exit non-zero)
        run: python3 scripts/ci/freshness.py --self-test

      - name: check-links.sh self-test (a 404, no answer and an empty tree must fail)
        run: scripts/ci/check-links.sh --self-test

      - name: check-pgs-labels.sh self-test (a wrong label, an empty answer and no answer must fail)
        run: scripts/ci/check-pgs-labels.sh --self-test

  pull-request:
    if: github.event_name == 'pull_request'
    needs: self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Files this pull request changes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE" HEAD > "${RUNNER_TEMP}/changed.txt"
          cat "${RUNNER_TEMP}/changed.txt"
          has() { grep -qxE "$1" "${RUNNER_TEMP}/changed.txt" && echo true || echo false; }
          {
            echo "prs=$(has 'scripts/25-prs\.sh|scripts/ci/check-pgs-labels\.sh|\.github/workflows/freshness\.yml')"
            echo "report=$(has 'scripts/ci/freshness\.py|versions\.env|\.github/workflows/freshness\.yml')"
          } >> "$GITHUB_OUTPUT"

      - name: Every download URL this pull request adds answers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/check-links.sh --since "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Every PGS ID's label matches the PGS Catalog
        if: steps.changed.outputs.prs == 'true'
        run: scripts/ci/check-pgs-labels.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report dry run (no issue is written)
        if: steps.changed.outputs.report == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/ci/freshness.py --out "${RUNNER_TEMP}/fresh.md" > /dev/null || rc=$?
          cat "${RUNNER_TEMP}/fresh.md" >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/fresh.md"
          exit "$rc"

  report:
    if: github.event_name != 'pull_request'
    needs: self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the three checks
        id: checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="${RUNNER_TEMP}"
          f=0; l=0; p=0
          python3 scripts/ci/freshness.py --out "${out}/fresh.md" > /dev/null || f=$?
          scripts/ci/check-links.sh > "${out}/links.md" || l=$?
          scripts/ci/check-pgs-labels.sh > "${out}/pgs.md" || p=$?
          part() {
            if [ -s "$1" ]; then cat "$1"; else echo "(no output; the check exited $2, see the run log)"; fi
          }
          state() { if [ "$1" -eq 0 ]; then echo "clean"; else echo "**needs attention** (exit $1)"; fi; }
          {
            echo "<!-- freshness-report: edited by .github/workflows/freshness.yml -->"
            echo "Monthly report from the Freshness workflow, $(date -u +%Y-%m-%d): ${RUN_URL}"
            echo ""
            echo "Each run edits this issue. Closing it is fine: the next run reopens it."
            echo ""
            echo "- Pins and databases: $(state "$f")"
            echo "- Download links: $(state "$l")"
            echo "- PGS labels: $(state "$p")"
            echo ""
            echo "## Pins and databases"
            echo ""
            part "${out}/fresh.md" "$f"
            echo ""
            echo "## Download links in scripts/ and docs/"
            echo ""
            part "${out}/links.md" "$l"
            echo ""
            echo "## PGS IDs in scripts/25-prs.sh"
            echo ""
            part "${out}/pgs.md" "$p"
          } > "${out}/body.md"
          cat "${out}/body.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$((f + l + p))" >> "$GITHUB_OUTPUT"

      - name: Create or edit the one freshness issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/freshness.py --update-issue "${RUNNER_TEMP}/body.md" --repo "${{ github.repository }}"

      # Fallback for the 60-day rule described at the top of this file.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh api "repos/${REPO}/commits?per_page=1" --jq '.[0].commit.committer.date')
          if [ -z "$last" ]; then
            echo "ERROR: could not read the date of the newest commit"
            exit 1
          fi
          age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 86400 ))
          echo "Newest commit on the default branch: ${last} (${age} days ago)."
          if [ "$age" -gt 25 ]; then
            gh api -X PUT "repos/${REPO}/actions/workflows/freshness.yml/enable"
            echo "Re-enabled the workflow so the 60-day rule does not switch the schedule off."
          fi

      - name: Fail when a check needs attention
        if: steps.checks.outputs.rc != '0'
        run: |
          echo "A lookup failed, a link is dead or a PGS label is wrong: see the issue and the step summary."
          exit 1
