name: Guard

# Checks that run the pipeline's own code, on every pull request with no
# path filter, so a change anywhere cannot skip them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-vars:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test (a planted undefined variable must be caught)
        run: scripts/ci/check-image-vars.sh --self-test

      - name: Every *_IMAGE a script uses is defined
        run: scripts/ci/check-image-vars.sh

  containers-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test (a stale tag, a missing or stray selector, a module's own container and a wrong version must be caught)
        run: scripts/ci/gen-containers-config.sh --self-test

      - name: conf/containers.config matches versions.env and gives every process an image
        run: scripts/ci/gen-containers-config.sh --check

  # Stub run of every tool with no container engine: the stubs only touch
  # files, so no image is pulled. Each process writes the tag of the image
  # Nextflow gave it (task.container) into its versions.yml, so the collected
  # file proves every withName selector matched its process at run time.
  all-tools-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: "25.10.4"

      - name: Stub run with every tool in --tools
        run: |
          d="${RUNNER_TEMP}/all-tools"
          mkdir -p "$d"
          for x in vep_cache vep_cache_cpsr pcgr_data pypgx_bundle cnvpytor_resources annotsv_annotations pgs_scoring; do
            mkdir -p "${d}/${x}"
          done
          for x in clinvar.vcf.gz clinvar.vcf.gz.tbi revel.tsv.gz revel.tsv.gz.tbi ancestry_ref.vcf.gz \
                   catalog.json hla.dat gnomad_constraint.tsv; do
            touch "${d}/${x}"
          done
          # expansion_hunter needs the sample's sex.
          sed '1s/$/,sex/; 2,$s/$/,female/' assets/test_samplesheet.csv > "${d}/samplesheet.csv"
          # Every name main.nf accepts in --tools.
          tools=$(sed -n '/def known_tools = \[/,/\]/p' main.nf | grep -o "'[a-z0-9_]*'" | tr -d "'" | paste -sd, -)
          echo "tools: ${tools}"
          [ "$(tr ',' '\n' <<<"$tools" | grep -c .)" -ge 28 ] || { echo "ERROR: read too few tools from main.nf"; exit 1; }
          printf '%s\n' "process.resourceLimits = [ cpus: 2, memory: '6.GB', time: '1.h' ]" > "${d}/ci.config"
          nextflow run main.nf -profile test -stub -ansi-log false -c "${d}/ci.config" \
            --input "${d}/samplesheet.csv" --tools "$tools" --outdir "${d}/out" \
            --vep_cache "${d}/vep_cache" --vep_cache_cpsr "${d}/vep_cache_cpsr" --pcgr_data "${d}/pcgr_data" \
            --pypgx_bundle "${d}/pypgx_bundle" --cnvpytor_resources "${d}/cnvpytor_resources" \
            --annotsv_annotations "${d}/annotsv_annotations" --pgs_scoring "${d}/pgs_scoring" \
            --clinvar "${d}/clinvar.vcf.gz" --clinvar_index "${d}/clinvar.vcf.gz.tbi" \
            --revel "${d}/revel.tsv.gz" --revel_index "${d}/revel.tsv.gz.tbi" \
            --ancestry_ref "${d}/ancestry_ref.vcf.gz" --expansion_catalog "${d}/catalog.json" \
            --hla_dat "${d}/hla.dat" --gnomad_constraint "${d}/gnomad_constraint.tsv"

      - name: Every process states the tag of its image from versions.env
        run: |
          cat "${RUNNER_TEMP}/all-tools/out/pipeline_info/software_versions.yml"
          scripts/ci/gen-containers-config.sh --check-versions "${RUNNER_TEMP}/all-tools/out/pipeline_info/software_versions.yml"

  fake-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test (a swallowed empty image, an unknown option and a failing case must be caught)
        run: scripts/ci/run-fake-docker-suite.sh --self-test

      - name: setup.sh, validate-setup.sh and run-all.sh against a fake docker
        run: scripts/ci/run-fake-docker-suite.sh

  helper-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test (planted bgzip/tabix calls behind if !, time and VAR= must be caught)
        run: scripts/ci/check-container-helpers.sh --self-test

      - name: Table of helper calls derived from scripts and modules
        run: scripts/ci/check-container-helpers.sh --list

      - name: Each helper binary exists in the image that calls it
        run: scripts/ci/check-container-helpers.sh

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every tests/test_*.py runs with python3 and every tests/test_*.sh with
      # bash, found by glob, so a new test file needs no workflow edit. The
      # two planted failures prove the loop reports a failing test.
      - name: Run every tests/test_*.py and tests/test_*.sh
        run: |
          run_tests() {
            local dir=$1 t rc n=0 fail=0
            shopt -s nullglob
            for t in "$dir"/test_*.py "$dir"/test_*.sh; do
              n=$((n + 1))
              rc=0
              echo "::group::${t}"
              case "$t" in
                *.py) python3 "$t" || rc=$? ;;
                *.sh) bash "$t" || rc=$? ;;
              esac
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then echo "PASS ${t}"; else echo "FAIL ${t} (exit ${rc})"; fail=1; fi
            done
            if [ "$n" -eq 0 ]; then echo "ERROR: no test files in ${dir}"; return 1; fi
            return "$fail"
          }

          ctl=$(mktemp -d)
          mkdir "${ctl}/py" "${ctl}/sh"
          echo 'assert False, "planted failure"' > "${ctl}/py/test_planted.py"
          echo 'exit 1' > "${ctl}/sh/test_planted.sh"
          for d in "${ctl}/py" "${ctl}/sh"; do
            if run_tests "$d"; then
              echo "ERROR: a planted failing test in ${d} was reported as passing"
              exit 1
            fi
          done
          echo "Control: both planted failures were reported."

          run_tests tests
