# SCRATCH: evidence runs for the wrong-results PR. Deleted before the PR is merged.
name: scratch-wrong-results-e2e

on:
  push:
    branches: [pgp/wrong-results-cheap]

permissions:
  contents: read

env:
  REF_URL: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz
  HG002_VCF_URL: https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/NISTv4.2.1/GRCh38/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz
  HG002_BAM_URL: https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/data/AshkenazimTrio/HG002_NA24385_son/NIST_HiSeq_HG002_Homogeneity-10953946/NHGRI_Illumina300X_AJtrio_novoalign_bams/HG002.GRCh38.60x.1.bam
  CLINVAR_URL: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz
  BCF: staphb/bcftools:1.21
  SAM: staphb/samtools:1.20

jobs:
  unit-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: New tests on this branch (must pass)
        run: |
          for t in tests/test_isec_columns.sh tests/test_indexcov_sex.sh; do
            echo "===== $t (branch) ====="
            bash "$t"
          done
      - name: Same tests against origin/main scripts (must fail)
        run: |
          OLD="${RUNNER_TEMP}/old"
          git worktree add --detach "$OLD" origin/main
          mkdir -p "$OLD/tests"
          cp tests/test_isec_columns.sh tests/test_indexcov_sex.sh "$OLD/tests/"
          for t in test_isec_columns.sh test_indexcov_sex.sh; do
            echo "===== $t (origin/main scripts) ====="
            set +e; bash "$OLD/tests/$t"; rc=$?; set -e
            echo "exit code: $rc"
            if [ "$rc" -eq 0 ]; then echo "EXPECTED RED, GOT GREEN"; exit 1; fi
          done
      - name: grep -c pattern before and after
        run: |
          echo "before: X=\$(grep -c foo /dev/null || echo 0)"; X=$(grep -c foo /dev/null || echo 0); echo "[$X]"
          echo "after:  X=\$(grep -c foo /dev/null || true)";   X=$(grep -c foo /dev/null || true);   echo "[$X]"

  pgs-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check PGS labels against the PGS Catalog API
        run: |
          cat > "${RUNNER_TEMP}/pgs_check.py" <<'PY'
          import json, re, sys, urllib.request
          src = open(sys.argv[1], encoding='utf-8').read()
          pairs = re.findall(r'"(PGS\d{6})\|([^"]+)"', src)
          if not pairs:  # old format: ["slug"]="PGS..."
              pairs = [(i, l.replace('_', ' ')) for l, i in re.findall(r'\["([a-z0-9_]+)"\]="(PGS\d{6})"', src)]
          def words(x):
              x = x.lower().replace("'", "").replace("\u2019", "")
              return " ".join(re.sub(r"[^a-z0-9]+", " ", x).split())
          wrong, diff = [], []
          for pid, label in pairs:
              d = json.load(urllib.request.urlopen(f"https://www.pgscatalog.org/rest/score/{pid}"))
              t = d["trait_reported"]
              exact = label.strip().lower() == t.strip().lower()
              disease = words(label) in words(t)
              print(f"{pid}\tlabel={label!r}\tapi={t!r}\texact={'yes' if exact else 'no'}\tdisease={'OK' if disease else 'WRONG'}")
              if not disease: wrong.append(pid)
              if not exact: diff.append(pid)
          print("WRONG DISEASE:", " ".join(wrong) or "none")
          print("NOT EXACT:", " ".join(diff) or "none")
          sys.exit(1 if (wrong or diff) else 0)
          PY
          echo "===== origin/main scripts/25-prs.sh ====="
          git show origin/main:scripts/25-prs.sh > "${RUNNER_TEMP}/old-25.sh"
          set +e; python3 "${RUNNER_TEMP}/pgs_check.py" "${RUNNER_TEMP}/old-25.sh"; rc=$?; set -e
          echo "exit code: $rc"
          [ "$rc" -ne 0 ] || { echo "EXPECTED RED"; exit 1; }
          echo "===== branch scripts/25-prs.sh ====="
          python3 "${RUNNER_TEMP}/pgs_check.py" scripts/25-prs.sh

  e2e-clinvar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: "25.10.4"
      - name: Fetch reference, HG002 VCF and ClinVar
        run: |
          G="${RUNNER_TEMP}/g"; echo "G=$G" >> "$GITHUB_ENV"
          mkdir -p "$G/reference" "$G/clinvar" "$G/HG002/vcf"
          curl -sSfL "$REF_URL" | gunzip > "$G/reference/Homo_sapiens_assembly38.fasta"
          docker run --rm -v "$G:/g" "$SAM" samtools faidx /g/reference/Homo_sapiens_assembly38.fasta
          curl -sSfL -o "$G/HG002/vcf/HG002.orig.vcf.gz" "$HG002_VCF_URL"
          curl -sSfL -o "$G/clinvar/clinvar.vcf.gz" "$CLINVAR_URL"
          curl -sSfL -o "$G/clinvar/clinvar.vcf.gz.tbi" "$CLINVAR_URL.tbi"
          docker run --rm -v "$G:/g" "$BCF" bash -c '
            set -e
            bcftools index -t /g/HG002/vcf/HG002.orig.vcf.gz
            echo "HG002 FILTER values:"; bcftools query -f "%FILTER\n" /g/HG002/vcf/HG002.orig.vcf.gz | sort | uniq -c
            for i in $(seq 1 22) X Y; do echo "$i chr$i"; done > /g/clinvar/chr_rename.txt; echo "MT chrM" >> /g/clinvar/chr_rename.txt
            bcftools annotate --rename-chrs /g/clinvar/chr_rename.txt /g/clinvar/clinvar.vcf.gz -Oz -o /g/clinvar/clinvar_chr.vcf.gz
            bcftools index -t /g/clinvar/clinvar_chr.vcf.gz
            bcftools view -i "CLNSIG~\"Pathogenic\" || CLNSIG~\"Likely_pathogenic\"" /g/clinvar/clinvar_chr.vcf.gz -Oz -o /g/clinvar/clinvar_pathogenic_chr.vcf.gz
            bcftools index -t /g/clinvar/clinvar_pathogenic_chr.vcf.gz
            bcftools view -i "CLNSIG~\"Pathogenic\" || CLNSIG~\"Likely_pathogenic\"" /g/clinvar/clinvar.vcf.gz -Oz -o /g/clinvar/clinvar_pathogenic_nochr.vcf.gz
            bcftools index -t /g/clinvar/clinvar_pathogenic_nochr.vcf.gz
            echo "ClinVar P/LP records: $(bcftools index -n /g/clinvar/clinvar_pathogenic_chr.vcf.gz)"'
      - name: Plant a multiallelic record carrying a ClinVar pathogenic allele
        run: |
          docker run --rm -v "$G:/g" "$BCF" bash -c '
            set -e
            # first ClinVar P/LP SNV on chr7 where HG002 has no record
            bcftools view -H -r chr7 -v snps -m2 -M2 /g/clinvar/clinvar_pathogenic_chr.vcf.gz \
              | cut -f1,2,4,5 | head -200 > /tmp/cand.tsv
            while IFS=$'"'"'\t'"'"' read -r c p r a; do
              if [ -z "$(bcftools view -H -r "$c:$p" /g/HG002/vcf/HG002.orig.vcf.gz)" ]; then
                printf "%s\t%s\t%s\t%s\n" "$c" "$p" "$r" "$a" > /g/planted.tsv; break
              fi
            done < /tmp/cand.tsv
            read -r c p r a < /g/planted.tsv
            o=$(for b in A C G T; do [ "$b" != "$r" ] && [ "$b" != "$a" ] && echo $b; done | head -1)
            echo "Planted: $c:$p $r>$o,$a GT 1/2 (ClinVar allele $r>$a)"
            bcftools view -h /g/HG002/vcf/HG002.orig.vcf.gz > /tmp/planted.vcf
            printf "%s\t%s\t.\t%s\t%s,%s\t50\tPASS\t.\tGT\t1/2\n" "$c" "$p" "$r" "$o" "$a" >> /tmp/planted.vcf
            bcftools view -Oz -o /tmp/planted.vcf.gz /tmp/planted.vcf && bcftools index -t /tmp/planted.vcf.gz
            bcftools concat -a -Oz -o /g/HG002/vcf/HG002.vcf.gz /g/HG002/vcf/HG002.orig.vcf.gz /tmp/planted.vcf.gz
            bcftools index -t /g/HG002/vcf/HG002.vcf.gz
            bcftools view -H -r "$c:$p" /g/HG002/vcf/HG002.vcf.gz | cut -f1-10
            # same sample with FILTER removed (all ".")
            mkdir -p /g/HG002dot/vcf
            bcftools annotate -x FILTER -Oz -o /g/HG002dot/vcf/HG002dot.vcf.gz /g/HG002/vcf/HG002.vcf.gz
            bcftools index -t /g/HG002dot/vcf/HG002dot.vcf.gz'
          sudo rm -f "$G/HG002/vcf/HG002.orig.vcf.gz" "$G/HG002/vcf/HG002.orig.vcf.gz.tbi"
          sudo chmod -R a+rwX "$G"
      - name: Step 06 (bash) on HG002
        run: |
          GENOME_DIR="$G" bash scripts/06-clinvar-screen.sh HG002
          read -r c p r a < "$G/planted.tsv"
          echo "Planted allele in bash hits:"
          awk -F'\t' -v c="$c" -v p="$p" -v r="$r" -v a="$a" '$1==c && $2==p && $4==r && $5==a' "$G/HG002/clinvar/HG002_clinvar_hits.vcf" | cut -f1-10 | tee "${RUNNER_TEMP}/planted_bash.txt"
          [ -s "${RUNNER_TEMP}/planted_bash.txt" ] || { echo "planted allele NOT reported by bash"; exit 1; }
      - name: Step 06 (bash) on the same VCF with FILTER '.'
        run: |
          GENOME_DIR="$G" bash scripts/06-clinvar-screen.sh HG002dot | tee "${RUNNER_TEMP}/dot.log"
          grep -q 'no PASS record' "${RUNNER_TEMP}/dot.log"
          A=$(grep -vc '^#' "$G/HG002/clinvar/HG002_clinvar_hits.vcf"); B=$(grep -vc '^#' "$G/HG002dot/clinvar/HG002dot_clinvar_hits.vcf")
          echo "hits PASS VCF: $A   hits FILTER '.' VCF: $B"
          [ "$A" = "$B" ]
      - name: Step 06 (bash) with a ClinVar file without chr prefixes (must fail)
        run: |
          G2="${RUNNER_TEMP}/g2"; mkdir -p "$G2/clinvar" "$G2/HG002/vcf"
          ln -s "$G/reference" "$G2/reference"
          cp "$G/HG002/vcf/HG002.vcf.gz" "$G/HG002/vcf/HG002.vcf.gz.tbi" "$G2/HG002/vcf/"
          cp "$G/clinvar/clinvar_pathogenic_nochr.vcf.gz" "$G2/clinvar/clinvar_pathogenic_chr.vcf.gz"
          cp "$G/clinvar/clinvar_pathogenic_nochr.vcf.gz.tbi" "$G2/clinvar/clinvar_pathogenic_chr.vcf.gz.tbi"
          set +e; GENOME_DIR="$G2" bash scripts/06-clinvar-screen.sh HG002 > "${RUNNER_TEMP}/nochr.log" 2>&1; rc=$?; set -e
          cat "${RUNNER_TEMP}/nochr.log"; echo "exit code: $rc"
          [ "$rc" -ne 0 ] && grep -q 'no contig name in common' "${RUNNER_TEMP}/nochr.log"
      - name: Both reports on HG002
        run: |
          GENOME_DIR="$G" bash scripts/24-html-report.sh HG002 > /dev/null
          GENOME_DIR="$G" bash scripts/generate-report.sh HG002 > /dev/null
          echo "HTML ClinVar rows:"
          grep -o '<tr><td>chr[^<]*</td>.*</tr>' "$G/HG002/HG002_report.html" | tee "${RUNNER_TEMP}/rows.txt"
          N=$(wc -l < "${RUNNER_TEMP}/rows.txt"); echo "rows: $N"
          [ "$N" -gt 0 ]
          # columns: chr pos ref alt genotype gene significance review
          BAD=$(sed 's#</td><td>#\t#g; s#<tr><td>##; s#</td></tr>##' "${RUNNER_TEMP}/rows.txt" | awk -F'\t' '$6=="." || $7=="." || $6=="" || $7==""' | wc -l)
          echo "rows without gene or significance: $BAD"
          [ "$BAD" -eq 0 ]
          echo "----- text report, ClinVar section -----"
          sed -n '/## ClinVar Pathogenic Screen/,/^$/p;/Hits (first 20)/,/^$/p' "$G/HG002/HG002_report.txt"
      - name: CLINVAR_SCREEN and HTML_REPORT modules (Nextflow) on HG002
        run: |
          W="${RUNNER_TEMP}/nf"; mkdir -p "$W"
          cat > "$W/main.nf" <<NF
          include { CLINVAR_SCREEN } from '${GITHUB_WORKSPACE}/modules/local/clinvar_screen/main'
          include { HTML_REPORT }    from '${GITHUB_WORKSPACE}/modules/local/html_report/main'
          workflow {
              ch_vcf = Channel.of([[id:'HG002'], file("${G}/HG002/vcf/HG002.vcf.gz"), file("${G}/HG002/vcf/HG002.vcf.gz.tbi")])
              CLINVAR_SCREEN(ch_vcf, file("${G}/clinvar/clinvar_pathogenic_chr.vcf.gz"), file("${G}/clinvar/clinvar_pathogenic_chr.vcf.gz.tbi"), file("${G}/reference/Homo_sapiens_assembly38.fasta"))
              def stubdir = "${GITHUB_WORKSPACE}/assets/stub"
              HTML_REPORT(CLINVAR_SCREEN.out.isec_dir.map { meta, hits -> [meta, hits, file("\${stubdir}/EMPTY_PHARMCAT"), file("\${stubdir}/EMPTY_CLINICAL"), file("\${stubdir}/EMPTY_CPSR"), file("\${stubdir}/EMPTY_SLIVAR")] })
          }
          NF
          cat > "$W/nextflow.config" <<'NF'
          params.outdir = 'results'
          params.publish_dir_mode = 'copy'
          docker.enabled = true
          docker.runOptions = '-u 0:0'
          NF
          cd "$W" && nextflow run main.nf
          read -r c p r a < "$G/planted.tsv"
          echo "Planted allele in module hits:"
          awk -F'\t' -v c="$c" -v p="$p" -v r="$r" -v a="$a" '$1==c && $2==p && $4==r && $5==a' results/HG002/clinvar/HG002_clinvar_hits.vcf | cut -f1-10 | tee planted_nf.txt
          [ -s planted_nf.txt ] || { echo "planted allele NOT reported by the module"; exit 1; }
          echo "bash hits: $(grep -vc '^#' "$G/HG002/clinvar/HG002_clinvar_hits.vcf")  module hits: $(grep -vc '^#' results/HG002/clinvar/HG002_clinvar_hits.vcf)"
          grep -o '<tr><td>chr[^<]*</td>.*</tr>' results/HG002/HG002_report.html > nfrows.txt
          BAD=$(sed 's#</td><td>#\t#g; s#<tr><td>##; s#</td></tr>##' nfrows.txt | awk -F'\t' '$6=="." || $7=="."' | wc -l)
          echo "module HTML rows: $(wc -l < nfrows.txt), without gene or significance: $BAD"
          head -3 nfrows.txt
          [ "$BAD" -eq 0 ]

  e2e-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch HG002 VCF
        run: |
          G="${RUNNER_TEMP}/g"; echo "G=$G" >> "$GITHUB_ENV"
          mkdir -p "$G/HG002/vcf"
          curl -sSfL -o "$G/HG002/vcf/HG002.vcf.gz" "$HG002_VCF_URL"
          curl -sSfL -o "$G/HG002/vcf/HG002.vcf.gz.tbi" "$HG002_VCF_URL.tbi"
      - name: Harmonised URL forced to 404 (must fail and leave no scoring file)
        run: |
          set +e
          PGS_BASE_URL=https://ftp.ebi.ac.uk/pub/databases/spot/pgs/no-such-dir GENOME_DIR="$G" bash scripts/25-prs.sh HG002 > "${RUNNER_TEMP}/404.log" 2>&1; rc=$?
          set -e
          tail -5 "${RUNNER_TEMP}/404.log"; echo "exit code: $rc"
          echo "prs_scores contents:"; ls -la "$G/prs_scores"
          [ "$rc" -ne 0 ]
          [ -z "$(ls -A "$G/prs_scores")" ]
      - name: Full step 25 on HG002
        run: |
          GENOME_DIR="$G" bash scripts/25-prs.sh HG002 | tee "${RUNNER_TEMP}/prs.log"
          S="$G/HG002/prs/HG002_prs_summary.tsv"
          head -1 "$S"
          head -1 "$S" | grep -q $'Condition\tPGS_ID\tScore_SUM\tVariants_Matched\tVariants_Total'
          echo "----- one .sscore -----"; cat "$G/HG002/prs/PGS000018.sscore"
          python3 - "$S" "$G/HG002/prs" <<'PY'
          import csv, sys
          summary, d = sys.argv[1], sys.argv[2]
          for row in csv.DictReader(open(summary), delimiter='\t'):
              if row['Score_SUM'] == 'NA':
                  print(row['PGS_ID'], 'no variant present'); continue
              ss = list(csv.DictReader(open(f"{d}/{row['PGS_ID']}.sscore"), delimiter='\t'))[0]
              ok = float(ss['SCORE1_SUM']) == float(row['Score_SUM']) and float(ss['ALLELE_CT']) / 2 == float(row['Variants_Matched'])
              print(row['PGS_ID'], row['Condition'], 'SCORE1_SUM', ss['SCORE1_SUM'], 'ALLELE_CT', ss['ALLELE_CT'], '->', row['Score_SUM'], row['Variants_Matched'], 'OK' if ok else 'MISMATCH')
              assert ok
          PY
          grep -c 'hom-ref sites are absent from this VCF' "${RUNNER_TEMP}/prs.log"
      - name: plink2 failure is a failure (bad weight in a cached scoring file)
        run: |
          F="$G/prs_scores/PGS000018.txt.gz"
          sudo chmod -R a+rwX "$G"
          { gzip -cd "$F" | awk -F'\t' 'BEGIN{OFS="\t"} /^#/ {print; next} !h {for(i=1;i<=NF;i++) if($i=="effect_weight") c=i; h=1; print; next} NR<200 {$c="abc"} {print}'; } | gzip > "$F.bad" && mv "$F.bad" "$F"
          set +e; GENOME_DIR="$G" bash scripts/25-prs.sh HG002 > "${RUNNER_TEMP}/bad.log" 2>&1; rc=$?; set -e
          tail -8 "${RUNNER_TEMP}/bad.log"; echo "exit code: $rc"
          [ "$rc" -ne 0 ]

  e2e-indexcov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HG002 BAM header plus the real genome-wide index
        run: |
          G="${RUNNER_TEMP}/g"; echo "G=$G" >> "$GITHUB_ENV"
          mkdir -p "$G/HG002/aligned"
          curl -sSfL -o "$G/HG002/aligned/HG002_sorted.bam.bai" "$HG002_BAM_URL.bai"
          docker run --rm -v "$G:/g" -v /etc/ssl/certs:/etc/ssl/certs:ro -e CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt -w /tmp "$SAM" sh -c "samtools view -H -b -o /g/HG002/aligned/HG002_sorted.bam '$HG002_BAM_URL'"
          touch "$G/HG002/aligned/HG002_sorted.bam.bai"
          ls -la "$G/HG002/aligned"
      - name: Step 16, declared male (HG002 is male)
        run: |
          GENOME_DIR="$G" bash scripts/16-indexcov.sh HG002 male
          echo "----- raw .ped -----"; cat "$G/HG002/indexcov/indexcov-indexcov.ped"
          echo "----- output files -----"; ls "$G/HG002/indexcov"
      - name: Step 16, declared female (must fail)
        run: |
          set +e; GENOME_DIR="$G" bash scripts/16-indexcov.sh HG002 female; rc=$?; set -e
          echo "exit code: $rc"; [ "$rc" -ne 0 ]

  e2e-pypgx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch reference, HG002 VCF, BAM slices and pypgx-bundle
        run: |
          G="${RUNNER_TEMP}/g"; echo "G=$G" >> "$GITHUB_ENV"
          mkdir -p "$G/reference" "$G/HG002/vcf" "$G/HG002/aligned"
          curl -sSfL "$REF_URL" | gunzip > "$G/reference/Homo_sapiens_assembly38.fasta"
          docker run --rm -v "$G:/g" "$SAM" samtools faidx /g/reference/Homo_sapiens_assembly38.fasta
          curl -sSfL -o "$G/HG002/vcf/HG002.vcf.gz" "$HG002_VCF_URL"
          curl -sSfL -o "$G/HG002/vcf/HG002.vcf.gz.tbi" "$HG002_VCF_URL.tbi"
          git clone --branch 0.26.0 --depth 1 https://github.com/sbslee/pypgx-bundle.git "$G/reference/pypgx-bundle"
          docker run --rm -v "$G:/g" -v /etc/ssl/certs:/etc/ssl/certs:ro -e CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt -w /tmp "$SAM" sh -c "
            set -e
            samtools view -H '$HG002_BAM_URL' | grep -c '^@SQ' || true
            REG='chr22:42080000-42180000 chr19:40800000-40920000 chr1:109640000-109730000 chr12:47820000-47960000'
            if samtools view -H '$HG002_BAM_URL' | grep -q 'SN:chr22_KI270879v1_alt'; then REG=\"\$REG chr22_KI270879v1_alt\"; echo 'GSTT1 alt contig present'; fi
            samtools view -b -o /tmp/slice.bam '$HG002_BAM_URL' \$REG
            samtools view -H /tmp/slice.bam | grep '^@RG' | head -2 || true
            # one read group whose SM matches the VCF sample, as step 02 writes it
            samtools addreplacerg -m overwrite_all -r '@RG\tID:HG002\tSM:HG002' -o /tmp/rg.bam /tmp/slice.bam
            samtools sort -o /g/HG002/aligned/HG002_sorted.bam /tmp/rg.bam
            samtools index /g/HG002/aligned/HG002_sorted.bam
            samtools idxstats /g/HG002/aligned/HG002_sorted.bam | awk '\$3>0'"
      - name: Step 07 (PharmCAT 3.2.0)
        run: |
          sudo chmod -R a+rwX "$G"
          GENOME_DIR="$G" bash scripts/07-pharmacogenomics.sh HG002
          ls -la "$G/HG002/vcf"
      - name: Step 32 (pypgx)
        run: |
          docker run --rm quay.io/biocontainers/pypgx:0.26.0--pyh7e72e81_0 pypgx prepare-depth-of-coverage -h | head -20
          GENOME_DIR="$G" bash scripts/32-pypgx.sh HG002
          echo "----- comparison -----"; cat "$G/HG002/pypgx/HG002_pharmcat_comparison.tsv"
          N=$(awk -F'\t' 'NR>1 && $5=="both"' "$G/HG002/pypgx/HG002_pharmcat_comparison.tsv" | wc -l)
          echo "genes called by both: $N"; [ "$N" -gt 0 ]
      - name: CNV_call equals pypgx's own CNV field
        run: |
          for GENE in CYP2D6 CYP2A6 GSTM1 GSTT1; do
            Z="/genome/HG002/pypgx/${GENE}/results.zip"
            [ -f "$G/HG002/pypgx/${GENE}/results.zip" ] || { echo "$GENE: no results.zip"; continue; }
            RAW=$(docker run --rm -v "$G:/genome" quay.io/biocontainers/pypgx:0.26.0--pyh7e72e81_0 pypgx print-data "$Z")
            echo "$GENE print-data:"; echo "$RAW" | cut -c1-300
            CNV=$(echo "$RAW" | awk -F'\t' 'NR==1{for(i=1;i<=NF;i++) if($i=="CNV") c=i} NR==2{print $c}')
            SUM=$(awk -F'\t' -v g="$GENE" '$1==g {print $4}' "$G/HG002/pypgx/HG002_pypgx_summary.tsv")
            echo "$GENE: print-data CNV=$CNV  summary CNV_call=$SUM"
            [ "$CNV" = "$SUM" ]
          done
      - name: Truncated PharmCAT JSON (must fail)
        run: |
          mkdir -p "$G/HG002/pharmcat"
          J=$(find "$G/HG002/vcf" -maxdepth 1 -name "*.report.json" | head -1)
          head -c 2000 "$J" > "$G/HG002/pharmcat/HG002.report.json"
          set +e; GENOME_DIR="$G" bash scripts/32-pypgx.sh HG002 > "${RUNNER_TEMP}/trunc.log" 2>&1; rc=$?; set -e
          tail -6 "${RUNNER_TEMP}/trunc.log"; echo "exit code: $rc"
          [ "$rc" -ne 0 ]
