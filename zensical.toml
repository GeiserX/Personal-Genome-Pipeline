# The docs site, built with Zensical and published at the site_url below.
# Build: `python -m zensical build --clean --strict`, then
# `python -I .github/scripts/site-check.py site` (the Docs workflow runs both).
# The strict build fails on a broken link or anchor. site-check.py fails on what
# the build does not check: a page in no nav entry, a nav entry for a missing
# file, a missing image, a link rooted at /. exclude_docs lists what under docs/
# is not a page; the nav title of each page equals its H1.

[project]
site_name = "OwnGenome"
site_url = "https://geiserx.github.io/OwnGenome/"
site_description = "Whole genome sequencing analysis pipeline for consumer hardware. 100% local, Docker-powered, free and open source."
repo_url = "https://github.com/GeiserX/OwnGenome"
repo_name = "GeiserX/OwnGenome"
edit_uri = "edit/main/docs/"
strict = true
extra_css = ["stylesheets/theme.css"]
# releases/ keeps release notes off the site until their release is tagged; the
# cut moves the page from exclude_docs into the nav.
exclude_docs = """
[A-Z]*.md
design/
research/
notes/
releases/
requirements-docs.txt
"""
